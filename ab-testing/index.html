<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A/B Testing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#000;--panel:#0b0b0b;--line:#1c1c1c;--line-2:#262626;
  --fg:#fff;--fg-2:#c7c7c7;--muted:#8d8d8d;--dim:#6e6e6e;
  --chip:#1f1f1f;--sel:#1b1b1b;
  --control:#8c8c8c;--variant:#8b5cf6;
  --active-fg:#3b9eff;--active-bg:#0c2745;
  --area:#1b1b1b;--strip:#232323;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg)}
body{color:var(--fg);font:400 13px/1.35 "Inter","Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
svg{display:block}

/* ---------- Back nav (repo convention) ---------- */
nav.back{display:flex;align-items:center;gap:8px;padding:14px 20px;border-bottom:1px solid var(--line);font-size:13px}
nav.back a{color:var(--muted);text-decoration:none}
nav.back a:hover,nav.back a:focus-visible{color:#fff;text-decoration:underline;text-underline-offset:3px}
nav.back span{color:var(--dim)}
nav.back b{font-weight:500;color:#fff}

/* ---------- App shell ---------- */
.app{display:grid;grid-template-columns:60px 243px minmax(0,1fr);min-height:calc(100vh - 49px);max-width:1280px;margin:0 auto}
.rail{border-right:1px solid var(--line)}
.side{border-right:1px solid var(--line);padding:12px 8px 24px}
.side h3{display:flex;align-items:center;justify-content:space-between;padding:6px 12px;font-size:13px;font-weight:500;color:#fff}
.side h3 .plus{width:16px;height:16px;display:grid;place-items:center;color:#fff;border-radius:4px}
.side h3 .plus:hover{background:var(--sel)}
.side ul{list-style:none;margin:2px 0 0}
.side li button{display:flex;align-items:center;gap:10px;width:100%;height:30px;padding:0 12px;border-radius:6px;color:#9a9a9a;font-size:13px}
.side li button:hover{background:#121212;color:#d4d4d4}
.side li button[aria-current="true"]{background:var(--sel);color:#fff}
.side li svg{flex:none;opacity:.9}
.side hr{border:0;border-top:1px solid var(--line);margin:12px 4px 14px}
.side .first{margin-bottom:14px}

/* ---------- Main ---------- */
main{min-width:0;padding:14px 18px 40px 10px}
.top{display:grid;grid-template-columns:288px minmax(0,1fr);gap:20px;align-items:start;padding-bottom:20px}
.preview{position:relative;width:288px;aspect-ratio:288/187;border-radius:6px;overflow:hidden;background:#111;border:1px solid var(--line-2)}
.preview img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top left;display:block;opacity:0;transition:opacity .2s}
.preview img.on{opacity:1}
.details{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:16px;row-gap:16px;padding-top:0}
.details dt{color:#fff;font-size:13px;margin-bottom:2px}
.details dd{color:#a3a3a3;font-size:13px;line-height:1.35}
.details .full{grid-column:1/-1}
.badge{display:inline-block;padding:1px 7px;border-radius:4px;background:var(--active-bg);color:var(--active-fg);font-size:11px;line-height:16px}
.edit{align-self:center;height:28px;padding:0 13px;border-radius:7px;background:var(--chip);color:#fff;font-size:13px;display:inline-flex;align-items:center}
.edit:hover{background:#2a2a2a}
.dist{display:contents}
.dist-copy{grid-column:1}
.dist .edit{grid-column:2;grid-row:span 1}
hr.rule{border:0;border-top:1px solid var(--line)}

/* ---------- Funnel ---------- */
.funnel{padding:24px 0 0}
.fcols{display:grid;grid-template-columns:1fr 1fr;position:relative}
.fcols::after{content:"";position:absolute;left:50%;top:-1px;bottom:0;width:1px;background:var(--line-2)}
.fcol{padding:0 0 0 0;min-width:0}
.fcol + .fcol{padding-left:20px}
.fhead{display:flex;justify-content:space-between;align-items:baseline;color:var(--fg-2);font-size:13px}
.fhead .pct{color:#9a9a9a}
.fval{font-size:18px;font-weight:400;margin-top:8px;letter-spacing:-.01em}
.chart{position:relative;height:178px;margin-top:22px}
.chart svg{position:absolute;inset:0;width:100%;height:100%}
.chart .bar{position:absolute;left:0;top:0;bottom:0;width:5px;border-radius:3px;background:#8d8d8d;z-index:2}
.chart .dot{position:absolute;left:62.7%;bottom:0;width:5px;height:9px;border-radius:3px;background:#9a9a9a;z-index:2}
.l-m{display:none}

/* ---------- Table ---------- */
.tbl{width:100%;border-collapse:collapse;margin-top:34px;font-variant-numeric:tabular-nums}
.tbl th{font-weight:400;color:var(--muted);text-align:right;padding:0 0 14px;font-size:13px;white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl td{text-align:right;padding:0;height:38px;border-top:1px solid var(--line);font-size:13px;color:#8f8f8f;white-space:nowrap}
.tbl tbody tr{cursor:pointer}
.tbl tbody tr.sel td{color:#fff}
.tbl tbody tr:hover td{color:#fff}
.tbl tr td:first-child .v{display:inline-flex;align-items:center;gap:12px}
.dotc{width:11px;height:11px;border-radius:50%;flex:none}
.tbl td:nth-child(n+2),.tbl th:nth-child(n+2){padding-left:12px}
.tbl td:last-child{padding-right:0}
.tbl .w1{width:15%}.tbl .w2{width:15%}.tbl .w3{width:19%}.tbl .w4{width:15%}.tbl .w5{width:15%}


/* ---------- Interactive funnel + variants ---------- */
button.fcol{display:block;width:100%;text-align:left;border-radius:6px;padding-bottom:4px;transition:background .15s}
.fcol.step:hover,.fcol.step[aria-expanded="true"]{background:#0f0f0f}
.fcol.step:focus-visible,.tbl tbody tr:focus-visible,.bd-row:focus-visible{outline:1px solid #4a4a4a;outline-offset:2px}
.fcols{margin:0 -8px 0 -8px}
.fcols::after{display:none}
.fcols{background:linear-gradient(var(--line-2),var(--line-2)) 50% 0/1px 100% no-repeat}
.fcol{padding-left:8px!important;padding-right:8px}
.fcol + .fcol{padding-left:28px!important}
.chev{width:14px;height:14px;margin-left:6px;color:var(--dim);transition:transform .15s}
.fcol.step[aria-expanded="true"] .chev{transform:rotate(180deg);color:#fff}
.fhead .lbl{display:inline-flex;align-items:center}
.fhead .right{display:inline-flex;align-items:baseline;gap:6px}
.chart{cursor:pointer}
.chart:hover .bar{background:#a8a8a8}
.breakdown{margin-top:18px;border-top:1px solid var(--line);padding-top:6px}
.breakdown[hidden]{display:none}
.bd-title{color:var(--muted);font-size:12px;padding:10px 0 4px}
.bd-row{display:grid;grid-template-columns:150px minmax(0,1fr) 64px;align-items:center;gap:14px;width:100%;height:34px;padding:0 6px;border-radius:6px;color:#8f8f8f}
.bd-row:hover,.bd-row.sel{color:#fff;background:#0f0f0f}
.bd-name{display:inline-flex;align-items:center;gap:10px;white-space:nowrap}
.bd-track{height:6px;border-radius:3px;background:#151515;overflow:hidden}
.bd-fill{display:block;height:100%;border-radius:3px;transition:width .3s}
.bd-val{text-align:right;font-variant-numeric:tabular-nums}
.sub{color:var(--dim);margin-left:10px;font-size:12px}
.tbl tbody tr.sel .sub{color:var(--muted)}
.preview img{transition:opacity .25s}
@media (max-width:820px){
  .sub,.pre{display:none}
  .bd-row{grid-template-columns:110px minmax(0,1fr) 52px;gap:10px}
}

/* ---------- Mobile ---------- */
.tabs{display:none}
@media (max-width:820px){
  .app{display:block}
  .rail,.side{display:none}
  main{padding:16px 20px 40px}
  .tabs{display:flex;gap:6px;overflow-x:auto;padding:12px 20px;border-bottom:1px solid var(--line);scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tabs button{flex:none;height:30px;padding:0 12px;border-radius:6px;color:#9a9a9a;font-size:13px}
  .tabs button[aria-current="true"]{background:var(--sel);color:#fff}
  .top{grid-template-columns:1fr;gap:20px}
  .preview{width:100%}
  .l-d{display:none}.l-m{display:inline}
  .chart{height:150px}
  .fcol + .fcol{padding-left:16px}
  .fval{font-size:20px}
  .tbl .w1,.tbl .w2,.tbl .w3,.tbl .w4,.tbl .w5{width:auto}
  .tbl th,.tbl td{font-size:12.5px}
  .tbl td:nth-child(n+2),.tbl th:nth-child(n+2){padding-left:8px}
  .tbl tr td:first-child .v{gap:8px}
}
@media (max-width:420px){
  nav.back{padding:12px 16px}
  main,.tabs{padding-left:16px;padding-right:16px}
  .tbl th,.tbl td{font-size:11.5px}
  .tbl td:nth-child(n+2),.tbl th:nth-child(n+2){padding-left:6px}
}
</style>
</head>
<body>

<nav class="back" aria-label="Apps"><a href="../">Apps</a><span>/</span><a href="../">Back to all projects</a><span>/</span><b>A/B Testing</b></nav>

<div class="tabs" role="tablist" aria-label="A/B Tests">
  <button aria-current="true">PSC Pages</button>
  <button>CTA Copy</button>
  <button>Discount</button>
  <button>Pricing</button>
  <button>Startups</button>
</div>

<div class="app">
  <div class="rail" aria-hidden="true"></div>

  <aside class="side" aria-label="Analytics">
    <h3 class="first">Analytics</h3>
    <ul class="first">
      <li><button><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"><path d="M2.5 7.2 8 2.5l5.5 4.7v5.8a.7.7 0 0 1-.7.7H3.2a.7.7 0 0 1-.7-.7z"/></svg>Overview</button></li>
    </ul>
    <hr>
    <h3>Funnels <button class="plus" aria-label="Add funnel"><svg width="12" height="12" viewBox="0 0 12 12" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"><path d="M6 1.5v9M1.5 6h9"/></svg></button></h3>
    <ul id="funnel-list">
      <li><button type="button" data-cta="Join the Slack"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"><path d="M3 3h10L3 13z"/></svg>PSC → Join the Slack</button></li>
      <li><button type="button" data-cta="Book my demo"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"><path d="M3 3h10L3 13z"/></svg>PSC → Book my demo</button></li>
    </ul>
    <hr>
    <h3>A/B Tests <button class="plus" aria-label="Add A/B test"><svg width="12" height="12" viewBox="0 0 12 12" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"><path d="M6 1.5v9M1.5 6h9"/></svg></button></h3>
    <ul>
      <li><button aria-current="true"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"><path d="M4 2.5h5l3 3v7.5a.5.5 0 0 1-.5.5h-7.5a.5.5 0 0 1-.5-.5v-10a.5.5 0 0 1 .5-.5z"/><path d="M9 2.5v3h3"/></svg>PSC Pages</button></li>
      <li><button><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"><path d="M4 2.5h5l3 3v7.5a.5.5 0 0 1-.5.5h-7.5a.5.5 0 0 1-.5-.5v-10a.5.5 0 0 1 .5-.5z"/><path d="M9 2.5v3h3"/></svg>CTA Copy</button></li>
      <li><button><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"><path d="M4 2.5h5l3 3v7.5a.5.5 0 0 1-.5.5h-7.5a.5.5 0 0 1-.5-.5v-10a.5.5 0 0 1 .5-.5z"/><path d="M9 2.5v3h3"/></svg>Discount</button></li>
      <li><button><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"><path d="M4 2.5h5l3 3v7.5a.5.5 0 0 1-.5.5h-7.5a.5.5 0 0 1-.5-.5v-10a.5.5 0 0 1 .5-.5z"/><path d="M9 2.5v3h3"/></svg>Pricing</button></li>
      <li><button><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"><path d="M4 2.5h5l3 3v7.5a.5.5 0 0 1-.5.5h-7.5a.5.5 0 0 1-.5-.5v-10a.5.5 0 0 1 .5-.5z"/><path d="M9 2.5v3h3"/></svg>Startups</button></li>
    </ul>
  </aside>

  <main>
    <section class="top">
      <div class="preview" id="preview" aria-live="polite"></div>
      <dl class="details">
        <div class="full"><dt>Status</dt><dd><span class="badge">Active</span></dd></div>
        <div class="full"><dt>Winner</dt><dd>9 days left until a winner can be determined</dd></div>
        <div class="dist-copy"><dt>Distribution</dt><dd>Even</dd></div>
        <button class="edit" type="button">Edit</button>
        <div class="full"><dt>Summary</dt><dd id="summary"></dd></div>
      </dl>
    </section>

    <hr class="rule">

    <section class="funnel" aria-label="Funnel">
      <div class="fcols">
        <button class="fcol step" type="button" data-step="views" aria-expanded="false" aria-controls="breakdown">
          <div class="fhead"><span class="lbl">View PSC page<svg class="chev" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 5.5 7 9l3.5-3.5"/></svg></span></div>
          <div class="fval" id="f-views"></div>
        </button>
        <button class="fcol step" type="button" data-step="clicks" aria-expanded="false" aria-controls="breakdown">
          <div class="fhead"><span class="lbl"><span class="pre">Clicked&nbsp;</span><span id="f-label"></span><svg class="chev" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 5.5 7 9l3.5-3.5"/></svg></span><span class="pct" id="f-pct"></span></div>
          <div class="fval" id="f-clicks"></div>
        </button>
      </div>
      <div class="chart" id="chart" role="button" tabindex="0" aria-label="Funnel chart. Activate to compare all variants at this step">
        <div class="bar"></div>
        <svg viewBox="0 0 1000 178" preserveAspectRatio="none" aria-hidden="true">
          <path d="M0 0 H70 C270 0 300 170 500 170 H1000 V178 H0 Z" fill="var(--area)"/>
          <rect x="500" y="170" width="500" height="8" fill="var(--strip)"/>
        </svg>
        <div class="dot"></div>
        <div style="position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--line-2)"></div>
      </div>
      <div class="breakdown" id="breakdown" hidden>
        <div class="bd-title" id="bd-title"></div>
        <div id="bd-rows"></div>
      </div>
    </section>

    <hr class="rule" style="margin-top:20px">

    <table class="tbl">
      <colgroup><col><col class="w1"><col class="w2"><col class="w3"><col class="w4"><col class="w5"></colgroup>
      <thead>
        <tr><th>Variant</th><th>Views</th><th>Clicks</th><th>Conversion</th><th>Lift</th><th>Best</th></tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </main>
</div>

<script>
(function(){
  // Variants are the Figma PSC pages. CTA labels come from each design.
  var V=[
    {id:'control',name:'Control',sub:'Community proof + role field',color:'#8c8c8c',img:'variant-b.png',w:1124,h:675,cta:'Join the Slack',views:9619,clicks:294},
    {id:'a',name:'Variant A',sub:'Color-block hero',color:'#8b5cf6',img:'variant-e.png',w:1124,h:715,cta:'Book my demo',views:9409,clicks:255},
    {id:'b',name:'Variant B',sub:'Slack screenshot hero',color:'#3ecf8e',img:'variant-c.png',w:1124,h:606,cta:'Join the Slack',views:9512,clicks:308}
  ];
  var $=function(i){return document.getElementById(i)};
  var fmtK=function(n){return n>=1000?(n/1000).toFixed(1)+'K':String(n)};
  var fmtN=function(n){return n.toLocaleString('en-US')};
  var cr=function(v){return v.clicks/v.views};

  // Chance each variant is best: seeded Monte Carlo over each conversion rate (normal approx. to the posterior).
  (function(){
    var seed=20230520;function rnd(){seed|=0;seed=seed+0x6D2B79F5|0;var t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}
    function norm(){return Math.sqrt(-2*Math.log(1-rnd()))*Math.cos(2*Math.PI*rnd())}
    var wins=V.map(function(){return 0}),N=20000;
    for(var i=0;i<N;i++){var best=-1,bv=-1;V.forEach(function(v,k){var p=cr(v),x=p+norm()*Math.sqrt(p*(1-p)/v.views);if(x>bv){bv=x;best=k}});wins[best]++}
    var tot=0;V.forEach(function(v,k){v.best=Math.round(wins[k]/N*1000)/10;tot+=v.best});
    var lead=wins.indexOf(Math.max.apply(null,wins));V[lead].best=Math.round((V[lead].best+100-tot)*10)/10;
  })();

  var sel=V[0],step=null;

  // Preview images (one per variant, cross-fade)
  var pv=$('preview');
  V.forEach(function(v){
    var im=new Image();im.src=v.img;im.width=v.w;im.height=v.h;im.id='img-'+v.id;
    im.alt=v.name+': Mavenoid Product Support Community page, '+v.sub;
    pv.appendChild(im);
  });

  // Table rows
  var tb=$('rows');
  V.forEach(function(v){
    var lift=v===V[0]?'—':((cr(v)-cr(V[0]))/cr(V[0])*100);
    var liftTxt=typeof lift==='number'?(lift>0?'+':'')+lift.toFixed(1)+'%':lift;
    var tr=document.createElement('tr');
    tr.tabIndex=0;tr.setAttribute('role','button');tr.dataset.id=v.id;
    tr.innerHTML='<td><span class="v"><i class="dotc" style="background:'+v.color+'"></i>'+v.name+'<span class="sub">'+v.sub+'</span></span></td>'+
      '<td>'+fmtN(v.views)+'</td><td>'+fmtN(v.clicks)+'</td><td>'+(cr(v)*100).toFixed(1)+'%</td><td>'+liftTxt+'</td><td>'+v.best.toFixed(1)+'%</td>';
    tr.addEventListener('click',function(){pick(v)});
    tr.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();pick(v)}});
    tb.appendChild(tr);
  });

  function renderBreakdown(){
    var bd=$('breakdown');
    if(!step){bd.hidden=true;return}
    bd.hidden=false;
    var key=step==='views'?'views':'clicks';
    $('bd-title').textContent=step==='views'?'Views by variant':'CTA clicks by variant';
    var max=Math.max.apply(null,V.map(function(v){return v[key]}));
    var box=$('bd-rows');box.innerHTML='';
    V.forEach(function(v){
      var b=document.createElement('button');b.type='button';b.className='bd-row'+(v===sel?' sel':'');
      var val=step==='views'?fmtN(v.views):fmtN(v.clicks)+' · '+(cr(v)*100).toFixed(1)+'%';
      b.innerHTML='<span class="bd-name"><i class="dotc" style="background:'+v.color+'"></i>'+v.name+'</span>'+
        '<span class="bd-track"><span class="bd-fill" style="width:'+(v[key]/max*100)+'%;background:'+v.color+'"></span></span>'+
        '<span class="bd-val">'+(step==='views'?fmtK(v.views):fmtN(v.clicks))+'</span>';
      b.title=val;
      b.addEventListener('click',function(){pick(v)});
      box.appendChild(b);
    });
  }

  function pick(v){
    sel=v;
    [].forEach.call(tb.children,function(r){var on=r.dataset.id===v.id;r.classList.toggle('sel',on);r.setAttribute('aria-pressed',on)});
    V.forEach(function(x){$('img-'+x.id).style.opacity=x===v?1:0});
    $('f-views').textContent=fmtK(v.views);
    $('f-clicks').textContent=fmtN(v.clicks);
    $('f-label').textContent='“'+v.cta+'”';
    $('f-pct').textContent=(cr(v)*100).toFixed(1)+'%';
    $('chart').setAttribute('role','button');
    $('summary').textContent='There’s a '+v.best.toFixed(1)+'% chance '+(v===V[0]?'the control variant':v.name)+' performs best. At current traffic, expect a conclusion in 9 days.';
    [].forEach.call(document.querySelectorAll('#funnel-list button'),function(b){b.setAttribute('aria-current',b.dataset.cta===v.cta)});
    renderBreakdown();
  }
  [].forEach.call(document.querySelectorAll('#funnel-list button'),function(b){
    b.addEventListener('click',function(){
      if(sel.cta===b.dataset.cta)return;
      pick(V.filter(function(v){return v.cta===b.dataset.cta})[0]);
    });
  });

  function toggleStep(s){step=(step===s)?null:s;
    [].forEach.call(document.querySelectorAll('.fcol.step'),function(b){b.setAttribute('aria-expanded',b.dataset.step===step)});
    renderBreakdown();
  }
  [].forEach.call(document.querySelectorAll('.fcol.step'),function(b){b.addEventListener('click',function(){toggleStep(b.dataset.step)})});
  var ch=$('chart');
  ch.addEventListener('click',function(e){var r=ch.getBoundingClientRect();toggleStep(e.clientX-r.left<r.width/2?'views':'clicks')});
  ch.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();toggleStep(step==='clicks'?'views':'clicks')}});

  // Tabs (mobile) highlight only
  var tabs=[].slice.call(document.querySelectorAll('.tabs button'));
  tabs.forEach(function(t){t.addEventListener('click',function(){tabs.forEach(function(x){x.setAttribute('aria-current',x===t?'true':'false')})})});

  pick(V[0]);
})();
</script>

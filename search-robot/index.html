  for(i=0;i<hds.length;i++)hds[i].setAttribute('transform','translate('+hx+' '+bob+') translate(144 0) scale('+fl+' 1) translate(-144 0) rotate('+ha+' 145 160)');
  var la=-4*pulse(2.1,1.3)-3*pulse(3.0,.9)+1.2*Math.sin(2*Math.PI*t/T*3);
  for(i=0;i<las.length;i++)las[i].setAttribute('transform','rotate('+la+' 66 158)');
  var ra=1.2*Math.sin(2*Math.PI*t/T*3+1)-5*(pulse(3.4,.45)+pulse(3.8,.45)+pulse(4.1,.45)+pulse(4.4,.45)+pulse(4.7,.45)+pulse(5.0,.45)+pulse(5.9,.5));
  $('ra').setAttribute('transform','rotate('+ra+' 172 162)');
}
/* clock */
var cur=0,speed=1,loop=true,playing=false,last=0,raf=0,sl=$('tl'),pp=$('pp');
function btn(){pp.textContent=playing?'Pause':'Play';pp.setAttribute('aria-label',pp.textContent)}
function show(){render(cur);sl.value=cur/T*1000;btn()}
function tick(now){raf=0;if(!playing)return;cur+=(now-last)/1000*speed;last=now;
  if(cur>=T){if(loop)cur%=T;else{cur=T-.001;playing=false}}
  show();if(playing)raf=requestAnimationFrame(tick)}
function resume(){if(cur>=T-.01)cur=0;playing=true;last=performance.now();if(!raf)raf=requestAnimationFrame(tick);btn()}
function pause(){playing=false;btn()}
function play(o){o=o||{};cur=o.from||0;speed=o.speed||1;loop=o.loop!==false;resume()}
function seek(x){pause();cur=x;show()}
window.__rb={play:play,seek:seek,pause:pause,T:T};
pp.addEventListener('click',function(){playing?pause():resume()});
$('replay').addEventListener('click',function(){play({from:0})});
$('art').addEventListener('click',function(){playing?pause():resume()});
var was=false;
sl.addEventListener('pointerdown',function(){was=playing});
sl.addEventListener('input',function(){playing=false;cur=sl.value/1000*T;render(cur);btn()});
sl.addEventListener('change',function(){if(was)resume();was=false});
show();
if(!CLIP&&!reduce)play({from:0});
})();
</script>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Thread Live Session</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0e0e0e; --panel:#171717; --line:#2a2a2a; --text:#f3f2ea; --muted:#9a998d;
  --yellow:#fff383; --ink:#141414;
  --font:"Inter","Helvetica Neue",Helvetica,Arial,sans-serif;
  --serif:"Instrument Serif",Georgia,serif;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font:400 14px/1.4 var(--font);-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
/* ---------- Back nav (shared across all sandbox projects) ---------- */
nav.back{box-sizing:border-box;flex:none;display:flex;align-items:center;gap:8px;height:49px;padding:0 20px;background:#000;border-bottom:1px solid #1c1c1c;font:400 13px/1.35 "Inter","Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;white-space:nowrap;overflow:hidden}
nav.back a{color:#8d8d8d;text-decoration:none}
nav.back a:hover,nav.back a:focus-visible{color:#fff;text-decoration:underline;text-underline-offset:3px}
nav.back span{color:#6e6e6e}
nav.back b{font-weight:500;color:#fff;overflow:hidden;text-overflow:ellipsis}
@media (max-width:640px){nav.back{padding:0 16px}}

.app{display:grid;grid-template-columns:minmax(0,1fr) 380px;height:calc(100vh - 49px);height:calc(100dvh - 49px)}
.stage{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;min-width:0;min-height:0;
  background:radial-gradient(circle at 1px 1px,#262626 1px,transparent 0) 0 0/22px 22px,var(--bg)}
#box{width:100%;flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
#cv{display:block;border-radius:4px;box-shadow:0 18px 60px rgba(0,0,0,.55);background:var(--yellow)}
.meta{font:500 11px/1 var(--font);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap;justify-content:center}

.panel{background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;padding:20px 20px 48px}
.brand{margin-bottom:6px}
.brand h1{font:400 30px/1 var(--serif);letter-spacing:-.01em}
.brand h1 em{font-style:italic}
.brand p{color:var(--muted);font-size:12.5px;margin-top:6px}
section{border-top:1px solid var(--line);padding:16px 0 4px;margin-top:16px}
h2{font-size:10.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--yellow);margin-bottom:10px}
.row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chip{border:1px solid #3a3a3a;background:transparent;border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:500;cursor:pointer;line-height:1.1}
.chip:hover{border-color:#777}
.chip.on{background:var(--yellow);border-color:var(--yellow);color:var(--ink)}
.chip small{opacity:.6;font-weight:400;margin-left:4px}
.sw{width:34px;height:34px;border-radius:8px;border:2px solid #3a3a3a;cursor:pointer;padding:0;position:relative;overflow:hidden}
.sw i{position:absolute;inset:auto 0 0 0;height:45%;display:block}
.sw.on{border-color:#fff;box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--yellow)}
label.f{display:block;margin-bottom:10px}
label.f>span{display:block;font-size:11.5px;color:var(--muted);margin-bottom:4px}
input[type=text],textarea{width:100%;background:#0f0f0f;border:1px solid #333;border-radius:8px;padding:8px 10px;font-size:13.5px;resize:vertical}
input[type=text]:focus,textarea:focus{outline:2px solid var(--yellow);outline-offset:0;border-color:transparent}
.hide{display:none!important}
.chk{display:flex;gap:8px;align-items:center;margin-bottom:10px;font-size:13px;cursor:pointer}
.chk input{accent-color:var(--yellow);width:16px;height:16px;margin:0}
.rng{display:grid;grid-template-columns:86px 1fr 28px;gap:8px;align-items:center;margin-bottom:8px;font-size:12.5px;color:var(--muted)}
.rng input{accent-color:var(--yellow);width:100%}
.rng output{color:var(--text);text-align:right;font-variant-numeric:tabular-nums}
.btn{border:1px solid #444;background:#222;border-radius:8px;padding:9px 14px;font-weight:600;font-size:13px;cursor:pointer}
.btn:hover{border-color:#888}
.btn.pri{background:var(--yellow);border-color:var(--yellow);color:var(--ink)}
.btn:disabled{opacity:.5;cursor:default}
#status{font-size:12px;color:var(--muted);min-height:18px;margin-top:6px}
.hint{font-size:11.5px;color:var(--muted);margin:-4px 0 10px}
:focus-visible{outline:2px solid var(--yellow);outline-offset:2px}
@media (max-width:900px){
  .app{grid-template-columns:1fr;height:auto}
  .stage{padding:16px;position:sticky;top:0;z-index:5;background:var(--bg)}
  #box{height:34vh;flex:none}
  .panel{border-left:0;border-top:1px solid var(--line);overflow:visible}
}
</style>
</head>
<body>
<nav class="back" aria-label="Sandbox"><a href="../">Sandbox</a><span>/</span><a href="../">Back to all projects</a><span>/</span><b>Thread Live Session</b></nav>
<div class="app">
  <main class="stage">
    <div id="box"><canvas id="cv" role="img" aria-label="Live preview of the LinkedIn Live screen"></canvas></div>
    <div class="meta"><span>16:9 · 1920 × 1080</span><span id="loopNote">12 s loop</span></div>
  </main>
  <aside class="panel">
    <div class="brand"><h1>Thread <em>live</em></h1><p>Screens for a LinkedIn Live session at the SMS marketing conference. Hairline grid, calligraphy loops, side tickers.</p></div>

    <section>
      <h2>Screen</h2>
      <div class="row" id="layout">
        <button class="chip" data-v="soon">Starting soon<small>10 s</small></button>
        <button class="chip" data-v="intro">Intro title</button>
        <button class="chip" data-v="live">Audience question</button>
        <button class="chip" data-v="session">Session title</button>
        <button class="chip" data-v="statement">Statement</button>
      </div>
      <h2>Colour</h2>
      <div class="row" id="theme"></div>
    </section>

    <section>
      <h2>Text</h2>
      <label class="f" data-for="soon"><span>Headline, one line per row (wrap a line in *stars* for italic)</span><textarea id="soonHead" rows="2"></textarea></label>
      <label class="f" data-for="soon"><span>Tag</span><input type="text" id="soonTag"></label>

      <label class="f" data-for="intro"><span>Tag</span><input type="text" id="introTag"></label>
      <label class="f" data-for="intro"><span>Sub line</span><input type="text" id="introSub"></label>
      <label class="f" data-for="intro"><span>Left ticker</span><input type="text" id="tickL"></label>
      <label class="f" data-for="intro"><span>Right ticker</span><input type="text" id="tickR"></label>
      <label class="f" data-for="intro"><span>Host one</span><input type="text" id="host1"></label>
      <label class="f" data-for="intro"><span>Host two</span><input type="text" id="host2"></label>

      <label class="f" data-for="live"><span>Question 1 from the audience</span><textarea id="q1" rows="3"></textarea></label>
      <label class="f" data-for="live"><span>Asked by</span><input type="text" id="qn1"></label>
      <label class="f" data-for="live"><span>Question 2 from the audience</span><textarea id="q2" rows="3"></textarea></label>
      <label class="f" data-for="live"><span>Asked by</span><input type="text" id="qn2"></label>
      <label class="f" data-for="live"><span>Question 3 from the audience</span><textarea id="q3" rows="3"></textarea></label>
      <label class="f" data-for="live"><span>Asked by</span><input type="text" id="qn3"></label>
      <label class="f" data-for="live"><span>On screen (three names)</span><input type="text" id="n1"></label>
      <label class="f" data-for="live"><input type="text" id="n2"></label>
      <label class="f" data-for="live"><input type="text" id="n3"></label>

      <label class="f" data-for="session"><span>Label</span><input type="text" id="sKick"></label>
      <label class="f" data-for="session"><span>Title, one line per row (wrap a line in *stars* for italic)</span><textarea id="sTitle" rows="3"></textarea></label>
      <label class="f" data-for="session"><span>Speaker</span><input type="text" id="sSpeaker"></label>
      <label class="f" data-for="session"><span>Role</span><input type="text" id="sRole"></label>

      <label class="f" data-for="statement"><span>Question above the statement</span><input type="text" id="stKick"></label>
      <label class="f" data-for="statement"><span>Statement, one line per row</span><textarea id="stText" rows="4"></textarea></label>

      <label class="f"><span>Date and place (bottom band)</span><input type="text" id="date"></label>
    </section>

    <section>
      <h2>Loops and motion</h2>
      <div class="rng"><span>Pen weight</span><input type="range" id="weight" min="1" max="10" step="1"><output id="weightO"></output></div>
      <label class="chk"><input type="checkbox" id="lines"> Hairline grid</label>
      <label class="chk"><input type="checkbox" id="anim"> Animate</label>
      <label class="chk"><input type="checkbox" id="auto"> Run of show: play every screen in turn</label>
      <div class="row"><button class="btn" id="restart">Restart this screen</button></div>
    </section>

    <section>
      <h2>Export</h2>
      <div class="row"><button class="btn pri" id="png">Download PNG</button><button class="btn" id="rec">Record 12 s loop (WebM)</button></div>
      <div id="status" role="status"></div>
    </section>
  </aside>
</div>

  sansText(ctx, 'THREAD 2026 · LIVE SESSIONS', GX + 30, yT, fs, fg, { wt: 700, ls });
  const lw = sansW(ctx, 'LIVE ON LINKEDIN', fs, 700, ls), pulse = still ? 0 : Math.sin(TAU * t * 4 / PERIOD);
  sansText(ctx, 'LIVE ON LINKEDIN', W - GX - 30, yT, fs, fg, { wt: 700, ls, align: 'right' });
  ctx.save(); ctx.fillStyle = fg; ctx.beginPath(); ctx.arc(W - GX - 30 - lw - 22, yT - 6, 5 + 1.6 * pulse, 0, TAU); ctx.fill(); ctx.restore();
  sansText(ctx, 'THE SMS MARKETING CONFERENCE', GX + 30, yB, fs, fg, { wt: 700, ls });
  if (S.date) sansText(ctx, S.date.toUpperCase(), W - GX - 30, yB, fs, fg, { wt: 700, ls, align: 'right' });
}
const attentive = (ctx, th) => { const aw = 170, ah = aw * ATT_H / ATT_W; drawAttentive(ctx, W - GX - 44 - aw, GY1 - 30 - ah, aw, th.fg); };

/* ===== 1. starting soon: 10 second count, mirrored calligraphy ===== */
function sSoon(ctx, c) {
  const { th, t, still } = c, tc = still ? STILL_T : ((t % PERIOD) + PERIOD) % PERIOD, live = tc >= COUNT;
  flourishPair(ctx, 0, GY0, W, GY1 - GY0, { color: th.fg, t, still, fw: penW() });
  grid(ctx, c);
  const pw = 700, ph = 620, px = W / 2 - pw / 2, py = H / 2 - ph / 2 + (still ? 0 : 4 * sway(t, 0.7));
  const bg = live ? th.fg : th.bg, ink = live ? th.bg : th.fg;
  ctx.save(); ctx.fillStyle = bg; ctx.strokeStyle = th.fg; ctx.lineWidth = 2; ctx.lineJoin = 'miter'; ctx.fillRect(px, py, pw, ph); ctx.strokeRect(px, py, pw, ph); ctx.restore();
  sansText(ctx, (live ? 'Going live' : S.soonTag).toUpperCase(), W / 2, py + 66, 22, ink, { wt: 700, ls: 6, align: 'center' });
  ctx.save(); ctx.strokeStyle = ink; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(px + 60, py + 96); ctx.lineTo(px + pw - 60, py + 96); ctx.stroke(); ctx.restore();
  const lines = parseLines(live ? 'Here we\n*go*' : S.soonHead, 3), fs = fitLines(ctx, lines, pw - 100, 190, 104, 0.9);
  lines.forEach((l, i) => slideC(ctx, l.s, W / 2, py + 96 + fs * 0.95 + i * fs * 0.9, fs, l.it, ink));
  const base = py + ph - 96;
  if (live) slideC(ctx, 'Live', W / 2, base - 8, 190, true, ink);
  else {
    const n = cl(Math.ceil(COUNT - tc), 1, COUNT), u = tc - Math.floor(tc), e = still ? 1 : easeOut(u / 0.3);
    ctx.save(); ctx.globalAlpha = 0.35 + 0.65 * e; slideC(ctx, String(n), W / 2, base + (1 - e) * 36, 212, false, ink); ctx.restore();
  }
  const cw = 52, gap = (pw - 120 - 10 * cw) / 9, ty = py + ph - 62;   // ten cells, one fills every second
  for (let i = 0; i < COUNT; i++) {
    const x = px + 60 + i * (cw + gap), f = live ? 1 : i < Math.floor(tc) ? 1 : i === Math.floor(tc) ? tc - Math.floor(tc) : 0;
    ctx.save(); ctx.strokeStyle = ink; ctx.lineWidth = 2; ctx.lineCap = 'butt'; ctx.globalAlpha = 0.28; ctx.beginPath(); ctx.moveTo(x, ty + 9); ctx.lineTo(x + cw, ty + 9); ctx.stroke(); ctx.globalAlpha = 1; ctx.lineWidth = 3; if (f > 0) { ctx.beginPath(); ctx.moveTo(x, ty + 9); ctx.lineTo(x + cw * f, ty + 9); ctx.stroke(); } ctx.restore();
  }
}

/* ===== 2. intro title: centred logo, side tickers ===== */
function ticker(ctx, c, dir, text) {
  const { th, t, still } = c, str = (text || '').toUpperCase().trim(); if (!str) return;
  ctx.save(); ctx.beginPath(); ctx.rect(dir < 0 ? 0 : W - GX, GY0 + 1, GX, GY1 - GY0 - 2); ctx.clip();
  ctx.font = sansFont(28, 700); setLS(ctx, 5); const tw = ctx.measureText(str).width, gap = 44, unit = tw + 2 * gap + 20;
  const n = Math.max(1, Math.round(1100 / unit)), off = ((still ? STILL_T : t) / PERIOD * n * unit) % unit;   // n whole units per loop, so it repeats exactly
  ctx.translate(dir < 0 ? GX / 2 : W - GX / 2, dir < 0 ? GY1 : GY0); ctx.rotate(dir < 0 ? -Math.PI / 2 : Math.PI / 2);
  ctx.fillStyle = th.fg; ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
  for (let p = -unit + off; p < GY1 - GY0 + unit; p += unit) { ctx.fillText(str, p, 1); star(ctx, p + tw + gap, 0, 10); }
  ctx.restore();
}
function sIntro(ctx, c) {
  const { th, t, still } = c; grid(ctx, c);
  ticker(ctx, c, -1, S.tickL); ticker(ctx, c, 1, S.tickR);
  const lw = 1000, k = lw / 2485, lh = 918 * k, top = 168 + (still ? 0 : 3 * sway(t, 0.3));
  drawLogo(ctx, W / 2 - lw / 2, top, k, th.fg, still ? 0 : 0.012 * sway(t, 0));
  let y = top + lh + 56;
  if (S.introTag) { tag(ctx, S.introTag.toUpperCase(), W / 2, y, 58, 22, th.fg, { center: true, pad: 30, ls: 5 }); y += 58 + 34; }
  if (S.introSub) serifText(ctx, S.introSub, W / 2, y + 48, 68, th.fg, { it: true, align: 'center' });
  // HOSTED BY  NAME x NAME, each name with a pen underline
  const fs = 32, ls = 4.5, by = GY1 - 66, hb = 'HOSTED BY', n1 = (S.host1 || '').toUpperCase(), n2 = (S.host2 || '').toUpperCase();
  const parts = [[hb, 500, 0]]; if (n1) parts.push([n1, 700, 1]); if (n1 && n2) parts.push(['X', 500, 0]); if (n2) parts.push([n2, 700, 2]);
  const sp = 26, ws = parts.map((p) => sansW(ctx, p[0], fs, p[1], ls)), total = ws.reduce((a, b) => a + b, 0) + sp * (parts.length - 1); let x = W / 2 - total / 2;
  parts.forEach((p, i) => { sansText(ctx, p[0], x, by, fs, th.fg, { wt: p[1], ls }); if (p[2]) underline(ctx, x, by + 10, ws[i], th.fg, t, still, 3 + p[2] * 2); x += ws[i] + sp; });
}

/* ===== 3. an audience question over the live view ===== */
const PH = ['p1', 'p2', 'p3'].map((n) => { const im = new Image(); im.onload = () => { dirty = true; }; im.src = 'photos/' + n + '.jpg'; return im; });
let dirty = true;
function tile(ctx, i, cx, cy, w, h, th, label, t, still) {
  const mat = 18, ol = 3, oy = still ? 0 : 3 * sway(t, i * 1.7); cy += oy;
  ctx.save(); ctx.fillStyle = DARK; ctx.fillRect(cx - w / 2 - mat + 9, cy - h / 2 - mat + 9, w + 2 * mat, h + 2 * mat);
  ctx.fillStyle = th.paper; ctx.fillRect(cx - w / 2 - mat, cy - h / 2 - mat, w + 2 * mat, h + 2 * mat);
  ctx.strokeStyle = DARK; ctx.lineWidth = ol; ctx.lineJoin = 'miter'; ctx.strokeRect(cx - w / 2 - mat, cy - h / 2 - mat, w + 2 * mat, h + 2 * mat);
  ctx.beginPath(); ctx.rect(cx - w / 2, cy - h / 2, w, h); ctx.clip();
  const im = PH[i];
  if (im.complete && im.naturalWidth) { const s = Math.max(w / im.naturalWidth, h / im.naturalHeight), dw = im.naturalWidth * s, dh = im.naturalHeight * s; ctx.drawImage(im, cx - dw / 2, cy - h / 2 - (dh - h) * ([0.5, 0.72, 0.5][i]), dw, dh); }
  else { ctx.fillStyle = '#d9d2b4'; ctx.fillRect(cx - w / 2, cy - h / 2, w, h); }
  ctx.restore();
  if (label) { const lw = sansW(ctx, label.toUpperCase(), 17, 700, 3) + 28; ctx.fillStyle = DARK; ctx.fillRect(cx - w / 2, cy + h / 2 - 38, lw, 38); sansText(ctx, label.toUpperCase(), cx - w / 2 + 14, cy + h / 2 - 13, 17, '#faf4de', { wt: 700, ls: 3 }); }
}
function sLive(ctx, c) {
  const { th, t, still } = c, tt = still ? STILL_T : ((t % PERIOD) + PERIOD) % PERIOD;
  flourishPair(ctx, 0, GY0, W, GY1 - GY0, { color: th.fg, t, still, fw: penW() });
  grid(ctx, c);
  const tw = 480, thh = 270, g = 18 + 19;
  tile(ctx, 0, W / 2 - tw / 2 - g, 77 + 19 + thh / 2 - 0, tw, thh, th, S.n1, t, still);
  tile(ctx, 1, W / 2 + tw / 2 + g, 77 + 19 + thh / 2 - 0, tw, thh, th, S.n2, t, still);
  tile(ctx, 2, W / 2, 77 + 19 + thh + 19 + 20 + 19 + thh / 2 - 0, tw, thh, th, S.n3, t, still);
  // the question card: wipes in from the left, holds, wipes out
  const qi = still ? 0 : Math.floor(tt / 4) % 3, lt = tt - Math.floor(tt / 4) * 4, Q = { q: S['q' + (qi + 1)], n: S['qn' + (qi + 1)] };   // three questions, 4 s each, so the 12 s loop repeats
  const e = still ? 1 : easeOut((lt - 0.2) / 0.6) * (1 - ease((lt - 3.45) / 0.5));
  if (e <= 0.001) return;
  const cw = 1440, cx = W / 2 - cw / 2; ctx.font = serifFont(54, false);
  const lines = wrapText(ctx, '“' + (Q.q || '').trim() + '”', cw - 120).slice(0, 3), ch = 104 + (lines.length - 1) * 60 + 30, cy0 = 972 - ch, cy = cy0 + (1 - e) * 30;
  ctx.save(); ctx.beginPath(); ctx.rect(cx - 20, cy - 70, (cw + 40) * Math.min(1, e * 1.1), ch + 110); ctx.clip(); ctx.globalAlpha = Math.min(1, e * 2);
  ctx.fillStyle = DARK; ctx.fillRect(cx + 10, cy + 10, cw, ch); ctx.fillStyle = th.paper; ctx.fillRect(cx, cy, cw, ch);
  ctx.strokeStyle = DARK; ctx.lineWidth = 3; ctx.strokeRect(cx + 1.5, cy + 1.5, cw - 3, ch - 3);
  lines.forEach((l, i) => serifText(ctx, l, cx + 60, cy + 104 + i * 60, 54, DARK));
  // who asked: ink chip with a monogram, name, role and a small "in" mark
  const nm = (Q.n || 'Guest').toUpperCase(), chipW = 64 + 22 + sansW(ctx, nm, 26, 700, 2.5) + 28, chy = cy - 32;
  ctx.fillStyle = DARK; ctx.fillRect(cx + 36, chy, chipW, 64);
  ctx.fillStyle = '#faf4de'; ctx.fillRect(cx + 36, chy, 64, 64);
  const ini = nm.split(/\s+/).map((w) => w[0]).slice(0, 2).join(''); serifText(ctx, ini, cx + 68, chy + 43, 34, DARK, { align: 'center' });
  sansText(ctx, nm, cx + 122, chy + 41, 26, '#faf4de', { wt: 700, ls: 2.5 });
  tag(ctx, 'AUDIENCE QUESTION', cx + cw - 36, cy - 24, 48, 18, DARK, { right: true, pad: 24, ls: 4, fill: th.paper, lw: 2 });
  ctx.restore();
}

/* ===== 4. session title card (breakout style) ===== */
function sSession(ctx, c) {
  const { th, t, still } = c; grid(ctx, c);
  const lx = GX + 64, lw = 400, px = lx + lw + 40, pw = W - GX - 64 - px, py = GY0 + 60, ph = GY1 - 60 - py;
  const box = (x, y, w, h) => { ctx.save(); ctx.strokeStyle = th.fg; ctx.lineWidth = 2; ctx.strokeRect(x + 1, y + 1, w - 2, h - 2); ctx.restore(); };   // outlines only, no fill: the type sits straight on the background
  box(lx, py, lw, 148); const k = 270 / 2485; drawLogo(ctx, lx + lw / 2 - 135, py + 74 - 918 * k / 2 + (still ? 0 : 2 * sway(t, 0.2)), k, th.fg, still ? 0 : 0.012 * sway(t, 0));
  box(lx, py + 172, lw, 100); sansText(ctx, (S.sKick || '').toUpperCase(), lx + lw / 2, py + 172 + 58, 24, th.fg, { wt: 700, ls: 3.5, align: 'center' });
  // calligraphy bleeds off the bottom right corner
  flourishPair(ctx, px, py, W - px, ph, { color: th.fg, t, still, fw: penW(), s: 0.62, va: 'bottom', side: 'R', off: 1.5 });
  const lines = parseLines(S.sTitle, 4), fs = fitLines(ctx, lines, pw - 150, ph - 360, 190, 0.92), tx = px;
  lines.forEach((l, i) => slide(ctx, l.s, tx, py + 10 + fs * 0.78 + i * fs * 0.92 + (still ? 0 : 2 * sway(t, i * 0.8)), fs, l.it, th.fg));
  const ry = py + ph - 150; ctx.save(); ctx.strokeStyle = th.fg; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(px, ry); ctx.lineTo(px + pw * 0.5, ry); ctx.stroke(); ctx.restore();
  serifText(ctx, S.sSpeaker || '', px, ry + 60, 54, th.fg, { it: true }); sansText(ctx, (S.sRole || '').toUpperCase(), px, ry + 100, 19, th.fg, { wt: 600, ls: 3.5 });
  attentive(ctx, th);
}

/* ===== 5. statement card ===== */
function sStatement(ctx, c) {
  const { th, t, still } = c;
  flourishPair(ctx, 0, GY0, W, GY1 - GY0, { color: th.fg, t, still, fw: penW() * 0.9, s: 0.5, off: 2.4 });
  grid(ctx, c);
  const lines = parseLines(S.stText, 5), fs = fitLines(ctx, lines, 1180, 520, 150, 0.98), blockH = lines.length * fs * 0.98, kick = (S.stKick || '').toUpperCase();
  const top = H / 2 - (blockH + (kick ? 90 : 0)) / 2 + 6;
  if (kick) sansText(ctx, kick, W / 2, top + 20, 26, th.fg, { wt: 700, ls: 5, align: 'center' });
  lines.forEach((l, i) => slideC(ctx, l.s, W / 2, top + (kick ? 90 : 0) + fs * 0.8 + i * fs * 0.98 + (still ? 0 : 2 * sway(t, i * 0.8)), fs, l.it, th.fg));
  attentive(ctx, th);
}

const SCENES = { soon: sSoon, intro: sIntro, live: sLive, session: sSession, statement: sStatement };
function render(ctx, t, still) {
  const th = THEMES[S.themes[S.layout]], c = { t, still, th };
  ctx.save(); ctx.fillStyle = th.bg; ctx.fillRect(0, 0, W, H); SCENES[S.layout](ctx, c); bands(ctx, c); ctx.restore();
}

/* ===== UI ===== */
const cv = $('#cv'), cx2 = cv.getContext('2d');
let scalePx = 1, frozenT = null, recording = false, t0 = performance.now();
function fit() {
  const box = $('#box'), aw = box.clientWidth, ah = Math.max(240, box.clientHeight);
  let w = aw, h = aw * H / W; if (h > ah) { h = ah; w = ah * W / H; }
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.style.width = w + 'px'; cv.style.height = h + 'px'; cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); scalePx = cv.width / W; dirty = true;
}
function setLayout(v) { S.layout = v; t0 = performance.now(); syncUI(); }
function frame(now) {
  if (S.auto && frozenT == null && S.anim && (now - t0) / 1000 >= PERIOD) setLayout(LAYOUTS[(LAYOUTS.indexOf(S.layout) + 1) % LAYOUTS.length]);
  if (S.anim || dirty || frozenT != null) {
    const t = frozenT != null ? frozenT : (S.anim ? (now - t0) / 1000 : STILL_T);
    cx2.setTransform(scalePx, 0, 0, scalePx, 0, 0); render(cx2, t, !S.anim && frozenT == null); dirty = false;
  }
  requestAnimationFrame(frame);
}
const TEXTS = ['soonHead', 'soonTag', 'introTag', 'introSub', 'tickL', 'tickR', 'host1', 'host2', 'q1', 'qn1', 'q2', 'qn2', 'q3', 'qn3', 'n1', 'n2', 'n3', 'sKick', 'sTitle', 'sSpeaker', 'sRole', 'stKick', 'stText', 'date'], CHECKS = ['lines', 'anim', 'auto'], RANGES = ['weight'];
function syncUI() {
  document.querySelectorAll('#layout .chip').forEach((b) => { b.classList.toggle('on', b.dataset.v === S.layout); b.setAttribute('aria-pressed', b.dataset.v === S.layout); });
  document.querySelectorAll('#theme .sw').forEach((b) => b.classList.toggle('on', b.dataset.v === S.themes[S.layout]));
  document.querySelectorAll('[data-for]').forEach((e) => e.classList.toggle('hide', !e.dataset.for.split(' ').includes(S.layout)));
  TEXTS.forEach((k) => { if ($('#' + k) !== document.activeElement) $('#' + k).value = S[k]; });
  CHECKS.forEach((k) => ($('#' + k).checked = S[k]));
  RANGES.forEach((k) => { $('#' + k).value = S[k]; $('#' + k + 'O').textContent = S[k]; });
  dirty = true;
}
$('#layout').addEventListener('click', (e) => { const b = e.target.closest('[data-v]'); if (b) { S.auto = false; setLayout(b.dataset.v); } });
$('#theme').innerHTML = Object.entries(THEMES).map(([k, v]) => `<button class="sw" data-v="${k}" title="${v.name}" aria-label="${v.name}" style="background:${v.bg}"><i style="background:${v.fg}"></i></button>`).join('');
$('#theme').addEventListener('click', (e) => { const b = e.target.closest('[data-v]'); if (b) { S.themes[S.layout] = b.dataset.v; syncUI(); } });
TEXTS.forEach((k) => $('#' + k).addEventListener('input', (e) => { S[k] = e.target.value; dirty = true; }));
CHECKS.forEach((k) => $('#' + k).addEventListener('change', (e) => { S[k] = e.target.checked; if (k !== 'lines') t0 = performance.now(); dirty = true; }));
RANGES.forEach((k) => $('#' + k).addEventListener('input', (e) => { S[k] = +e.target.value; $('#' + k + 'O').textContent = S[k]; dirty = true; }));
$('#restart').addEventListener('click', () => { t0 = performance.now(); dirty = true; });

/* export */
const status = (m) => ($('#status').textContent = m);
function download(blob, name) { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); }
$('#png').addEventListener('click', () => {
  const oc = document.createElement('canvas'); oc.width = W; oc.height = H;
  render(oc.getContext('2d'), S.anim ? (performance.now() - t0) / 1000 : STILL_T, !S.anim);
  oc.toBlob((b) => { download(b, 'thread-live-' + S.layout + '.png'); status('Saved a ' + W + ' × ' + H + ' PNG.'); }, 'image/png');
});
$('#rec').addEventListener('click', () => {
  if (recording) return;
  if (!window.MediaRecorder || !HTMLCanvasElement.prototype.captureStream) { status('This browser cannot record video from a canvas. Use the PNG export.'); return; }
  const k = 1280 / W, rc = document.createElement('canvas'); rc.width = 1280; rc.height = Math.round(H * k);
  const rx = rc.getContext('2d'), stream = rc.captureStream(30), chunks = [], mt = ['video/webm;codecs=vp9', 'video/webm'].find((m) => MediaRecorder.isTypeSupported(m));
  const mr = new MediaRecorder(stream, mt ? { mimeType: mt, videoBitsPerSecond: 8e6 } : undefined);
  mr.ondataavailable = (e) => e.data.size && chunks.push(e.data);
  mr.onstop = () => { recording = false; $('#rec').disabled = false; download(new Blob(chunks, { type: 'video/webm' }), 'thread-live-' + S.layout + '.webm'); status('Saved a 12 s loop.'); };
  recording = true; $('#rec').disabled = true; const start = performance.now(); mr.start();
  const step = () => { const t = (performance.now() - start) / 1000; rx.setTransform(k, 0, 0, k, 0, 0); render(rx, Math.min(t, PERIOD), false); status('Recording… ' + Math.min(PERIOD, Math.ceil(t)) + ' / ' + PERIOD + ' s'); if (t < PERIOD) requestAnimationFrame(step); else mr.stop(); };
  step();
});

/* hash: #layout=intro&theme=ink&t=3 (handy for stills) */
new URLSearchParams(location.hash.slice(1)).forEach((v, k) => {
  if (k === 'layout' && SCENES[v]) S.layout = v; else if (k === 'theme' && THEMES[v]) S.themes[S.layout] = v; else if (k === 't') frozenT = +v; else if (k === 'anim') S.anim = v !== '0';
});
addEventListener('resize', fit);
Promise.all([document.fonts.load("172px 'Instrument Serif'"), document.fonts.load("italic 60px 'Instrument Serif'"), document.fonts.load('500 40px Inter'), document.fonts.load('700 40px Inter')]).catch(() => {}).then(() => { dirty = true; });
syncUI(); fit(); requestAnimationFrame(frame);
</script>

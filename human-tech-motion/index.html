*{box-sizing:border-box;margin:0}
html,body{height:100%;background:#0d0d0d;color:#fff;overflow:hidden}
body{display:flex;flex-direction:column;font:400 13px/1.35 "Inter","Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
/* ---------- Back nav (shared across all sandbox projects) ---------- */
nav.back{box-sizing:border-box;flex:none;display:flex;align-items:center;gap:8px;height:49px;padding:0 20px;background:#000;border-bottom:1px solid #1c1c1c;white-space:nowrap;overflow:hidden}
nav.back a{color:#8d8d8d;text-decoration:none}
nav.back a:hover,nav.back a:focus-visible{color:#fff;text-decoration:underline;text-underline-offset:3px}
nav.back span{color:#6e6e6e}
nav.back b{font-weight:500;color:#fff;overflow:hidden;text-overflow:ellipsis}
.tools{margin-left:auto;display:flex;align-items:center;gap:10px}
.live{color:#8d8d8d;font:500 12px/1 ui-monospace,Menlo,Consolas,monospace;min-width:150px;text-align:right}
.sw{display:flex;gap:3px;border:1px solid #333;border-radius:999px;padding:2px}
.sw button{font:500 12px/1 "Inter",Arial,sans-serif;color:#8d8d8d;background:none;border:0;border-radius:999px;min-width:26px;padding:6px 7px;cursor:pointer}
.sw button:hover{color:#fff}.sw button.on{background:#fff;color:#000}
.live i{font-style:normal;color:#ffc72c}
.tools button{font:500 12px/1 "Inter","Helvetica Neue",Arial,sans-serif;color:#d0d0d0;background:none;border:1px solid #333;border-radius:999px;padding:7px 13px;cursor:pointer}
.tools button:hover{color:#000;background:#fff;border-color:#fff}
.tools button:focus-visible{outline:2px solid #fff;outline-offset:1px}
@media (max-width:900px){nav.back>span:nth-of-type(2),nav.back>b,.live{display:none}}@media (max-width:640px){nav.back{padding:0 12px}.tools{gap:6px}.tools #shuf{display:none}}
main{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
#stage{width:min(100%,calc((100vh - 49px) * 16 / 9));aspect-ratio:16/9;display:block}
</style>

  els.forEach(e=>e.draw());
  const f=Math.floor(t*12);c.globalCompositeOperation='overlay';c.globalAlpha=.14;                // neutral grain: tactile texture, adds no colour
  const ox=-hash(f,1)*220,oy=-hash(f,2)*220;for(let x=ox;x<W;x+=220)for(let y=oy;y<H;y+=220)c.drawImage(gcv,x,y);
  c.globalCompositeOperation='source-over';c.globalAlpha=1;
}

/* ---------- loop, controls ---------- */
const live=document.getElementById('live'),pp=document.getElementById('pp'),shuf=document.getElementById('shuf'),sw=document.getElementById('sw');
const hp=new URLSearchParams(location.hash.slice(1));
let t0=performance.now(),off=parseFloat(hp.get('t'))||0,paused=hp.has('pause')||matchMedia('(prefers-reduced-motion: reduce)').matches,holdT=off,lastLive=0;
if(hp.get('seed'))SEED=parseInt(hp.get('seed'),10)||1;
function fit(){const r=cv.getBoundingClientRect(),d=Math.min(window.devicePixelRatio||1,2);cv.width=Math.round(r.width*d);cv.height=Math.round(r.height*d)}
function pick(i){
  comp=COMPS[(i+COMPS.length)%COMPS.length];els=[];comp.build();schedule();
  [...sw.children].forEach((b,j)=>{b.classList.toggle('on',j===comp.i);b.setAttribute('aria-pressed',j===comp.i)});
  try{history.replaceState(null,'','#c='+(comp.i+1))}catch(e){}
}
function tick(now){
  const t=paused?holdT:(((now-t0)/1000+off)%L+L)%L;holdT=t;frame(t);
  if(now-lastLive>120){live.innerHTML=comp.name+' · moving <i>'+count+'</i>/'+els.length;lastLive=now}
  requestAnimationFrame(tick);
}
function setPaused(v){if(v===paused)return;if(!v){t0=performance.now();off=holdT}paused=v;pp.textContent=paused?'Play':'Pause'}
COMPS.forEach((k,i)=>{const b=document.createElement('button');b.type='button';b.textContent=i+1;b.title=k.name;b.setAttribute('aria-label',k.name);b.onclick=()=>pick(i);sw.appendChild(b)});
pp.onclick=()=>setPaused(!paused);
shuf.onclick=()=>{SEED=SEED%999+1;schedule()};
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();setPaused(!paused)}else if(e.key==='r'||e.key==='R')shuf.click();else if(e.key==='ArrowRight')pick(comp.i+1);else if(e.key==='ArrowLeft')pick(comp.i-1)});
addEventListener('resize',fit);
function boot(){
  fit();pick((parseInt(hp.get('c'),10)||1)-1);pp.textContent=paused?'Play':'Pause';
  window.mm={seek:t=>{holdT=t;paused=true;off=t;frame(t);return count},pick,count:()=>count,total:()=>els.length,L:L,pal:()=>COMPS.map(k=>[k.name,k.pal])};
  requestAnimationFrame(tick);
}
})();
</script>

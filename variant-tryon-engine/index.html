<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Variant Try-On Engine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
html,body{min-height:100%;background:#fff;color:#1E3156;font:400 14px/1.4 "Inter","Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{display:flex;flex-direction:column;min-height:100vh}
/* ---------- Back nav (shared across all sandbox projects) ---------- */
nav.back{box-sizing:border-box;flex:none;display:flex;align-items:center;gap:8px;height:49px;padding:0 20px;background:#000;border-bottom:1px solid #1c1c1c;font:400 13px/1.35 "Inter","Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;white-space:nowrap}
nav.back a{color:#8d8d8d;text-decoration:none}
nav.back a:hover,nav.back a:focus-visible{color:#fff;text-decoration:underline;text-underline-offset:3px}
nav.back span{color:#6e6e6e}
nav.back b{font-weight:500;color:#fff;overflow:hidden;text-overflow:ellipsis}
@media (max-width:640px){nav.back{padding:0 16px}nav.back>span:nth-of-type(2),nav.back>b{display:none}}
nav.back .ctl{margin-left:auto;display:flex;align-items:center;gap:10px;min-width:0}
nav.back button{font:inherit;color:#fff;background:transparent;border:1px solid #4a4a4a;border-radius:8px;padding:4px 12px;cursor:pointer}
nav.back button:hover{border-color:#fff}
nav.back button:focus-visible{outline:2px solid #79BFF4;outline-offset:2px}
nav.back #pp{min-width:64px}
nav.back input[type=range]{width:240px;min-width:60px;accent-color:#79BFF4;cursor:pointer}

main{width:100%;max-width:1320px;margin:0 auto;padding:18px 20px 40px;display:flex;flex-direction:column;gap:22px}
.top{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
.stage{border-radius:18px;overflow:hidden;aspect-ratio:8/5;border:1.5px solid #1E3156;position:relative;background:#eee}
.stage svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.ctl{display:flex;flex-direction:column;gap:14px}
.grp h2{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#5b6b88;margin-bottom:7px}
.seg{display:grid;gap:6px}.seg.c3{grid-template-columns:repeat(3,1fr)}.seg.c2{grid-template-columns:repeat(2,1fr)}
.seg button,.act button,.act a{font:inherit;font-weight:500;color:#1E3156;background:#fff;border:1.5px solid #1E3156;border-radius:10px;padding:8px 10px;cursor:pointer;text-align:center;text-decoration:none;display:block}
.seg button:hover,.act button:hover,.act a:hover{background:#D3E9FD}
.seg button[aria-pressed=true]{background:#1E3156;color:#fff}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #89BDEF;outline-offset:2px}
.note{font-size:13px;color:#4a5b7a;margin-top:7px;min-height:36px}
.sw{display:flex;gap:7px;flex-wrap:wrap}
.sw button{width:30px;height:30px;border-radius:50%;border:1.5px solid #1E3156;cursor:pointer;padding:0;position:relative}
.sw button[aria-pressed=true]{box-shadow:0 0 0 2px #fff,0 0 0 4px #1E3156}
.sw button.auto{background:conic-gradient(#F6E9A2 0 25%,#4B7CCD 0 50%,#E76E4E 0 75%,#D3E9FD 0)}
.row{display:flex;align-items:center;gap:10px;justify-content:space-between}
.row input[type=range]{flex:1;accent-color:#4B7CCD}
.tog{display:flex;align-items:center;gap:8px;cursor:pointer}
.tog input{accent-color:#4B7CCD;width:16px;height:16px}
.act{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.act .wide{grid-column:1/-1}
.act .pri{background:#1E3156;color:#fff}.act .pri:hover{background:#4B7CCD}
h3{font-size:16px;font-weight:600;margin-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.card{border:0;padding:0;background:none;cursor:pointer;text-align:left;font:inherit;color:inherit}
.card .th{display:block;border-radius:12px;overflow:hidden;aspect-ratio:8/5;border:1.5px solid #1E3156;position:relative}
.card .th svg{position:absolute;inset:0;width:100%;height:100%}
.card b{display:block;margin-top:6px;font-weight:600}
.card[aria-pressed=true] .th{box-shadow:0 0 0 3px #fff,0 0 0 5px #4B7CCD}
@media (max-width:980px){.top{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,1fr)}}
</style>
<style id="roles"></style>
</head>
<body>
<nav class="back" aria-label="Sandbox"><a href="../">Sandbox</a><span>/</span><a href="../">Back to all projects</a><span>/</span><b>Variant Try-On Engine</b></nav>
<main>
<div class="top">
<div class="stage" id="stage"></div>
<div class="ctl">
 <div class="grp"><h2>Scene</h2><div class="seg c3" id="scenes"></div></div>
 <div class="grp"><h2>Look</h2><div class="seg c2" id="looks"></div><p class="note" id="note"></p></div>
 <div class="grp"><h2>Background</h2><div class="sw" id="bgs"></div></div>
 <div class="grp"><h2>Screen accent</h2><div class="sw" id="accA"></div></div>
 <div class="grp"><h2>Tool accent</h2><div class="sw" id="accB"></div></div>
 <div class="grp"><div class="row"><h2 style="margin:0">Line weight</h2><input id="sw" type="range" min="1.5" max="5" step=".1" aria-label="Line weight"></div></div>
 <div class="grp"><label class="tog"><input type="checkbox" id="tex"> Halftone and stripes</label> <label class="tog" style="margin-top:6px"><input type="checkbox" id="shd"> Long shadow</label></div>
 <div class="act"><button id="reset" type="button">Reset tweaks</button><button id="svg" type="button">Download SVG</button><button id="png" type="button">Download PNG</button><a id="use" class="pri" href="#">Use in flow</a></div>
</div>
</div>
<section><h3>Every look on this scene</h3><div class="grid" id="grid"></div></section>
</main>
<script>
/* ====== ART: sander troubleshooting scenes, drawn from roles so every look is just a token set ====== */
const BR = { navy: '#1E3156', blue: '#4B7CCD', orange: '#E76E4E', yellow: '#F6E9A2', light: '#D3E9FD', med: '#89BDEF', white: '#FFFFFF' };
const N = BR.navy, B = BR.blue, O = BR.orange, Y = BR.yellow, LB = BR.light, MB = BR.med, W = '#FFFFFF';
/* a role is [fill, stroke]. HT = halftone dots, ST = stripes (both drawn in the outline colour). */
const VARIANTS = {
  mono: { label: 'Monochrome', note: 'White faces, navy and grey people. Colour only on the screen and the tool.',
    bg: '#F6F5F3', sw: 2.6, exo: 1,
    skin: [W, N], skin2: ['HT', N], hair: [N, N], top: [N, N], top2: ['HT', N],
    ui: [W, N], bar: ['HT', N], soft: ['#EEEEEE', 'none'], ui1: [B, 'none'], ui2: [O, 'none'],
    obj: [O, N], obj2: [B, N], paper: ['HT', N], tag: [Y, N], ext: [N, 'none'], ext2: ['HT', 'none'] },
  line: { label: 'Fill and line', note: 'Flat colour fills with no outline, beside parts that are outline only.',
    bg: W, sw: 2.4, exo: 1,
    skin: [W, N], skin2: [W, N], hair: [N, 'none'], top: [B, 'none'], top2: [W, N],
    ui: [W, N], bar: [LB, N], soft: [LB, 'none'], ui1: [B, 'none'], ui2: [O, 'none'],
    obj: [O, 'none'], obj2: [W, N], paper: [W, N], tag: [Y, 'none'], ext: [LB, 'none'], ext2: [MB, 'none'] },
  pale: { label: 'Pale and brand', note: 'A pale blue ground with the Mavenoid palette as accents.',
    bg: LB, sw: 2.5, exo: 1,
    skin: [W, N], skin2: [W, N], hair: [N, N], top: [W, N], top2: [B, N],
    ui: [W, N], bar: [MB, N], soft: ['#EAF3FE', 'none'], ui1: [B, N], ui2: [Y, N],
    obj: [O, N], obj2: [B, N], paper: ['HT', N], tag: [O, N], ext: [N, N], ext2: ['HT', N] },
  bold: { label: 'Bold yellow', note: 'A loud yellow ground, heavy outlines, blue and orange accents.',
    bg: Y, sw: 3.5, exo: 1,
    skin: [W, N], skin2: [W, N], hair: [N, N], top: [B, N], top2: ['ST', N],
    ui: [W, N], bar: ['HT', N], soft: [LB, 'none'], ui1: [B, N], ui2: [O, N],
    obj: [O, N], obj2: [W, N], paper: ['HT', N], tag: [B, N], ext: [N, N], ext2: ['ST', N] }
};
const ROLES = ['skin', 'skin2', 'hair', 'top', 'top2', 'ui', 'bar', 'soft', 'ui1', 'ui2', 'obj', 'obj2', 'paper', 'tag', 'ext', 'ext2'];
const ROLE_CSS = ROLES.map(r => `.sc .r-${r}{fill:var(--${r}-f);stroke:var(--${r}-s)}`).join('') +
  '.sc [class*="r-"]{stroke-width:var(--sw);stroke-linejoin:round;stroke-linecap:round}' +
  '.sc .ln{fill:none;stroke:var(--line);stroke-width:var(--sw);stroke-linecap:round;stroke-linejoin:round}' +
  '.sc .fl{fill:var(--line);stroke:none}.sc .ex{opacity:var(--exo)}.sc .bgr{fill:var(--bg)}' +
  '.sc text{font-family:"Inter","Helvetica Neue",Helvetica,Arial,sans-serif;font-weight:500;fill:var(--line);stroke:none}' +
  '.sc .tw{fill:#fff}.sc .gl{fill:none;stroke:var(--glass);stroke-width:var(--sw)}';

let UID = 0;
/* tokens -> inline style for one svg. texture:false swaps halftone/stripes for flat tints */
function tokenStyle(v, uid, texture) {
  const m = { HT: texture ? `url(#ht-${uid})` : '#D5DBE6', ST: texture ? `url(#st-${uid})` : W };
  let s = `--bg:${v.bg};--line:${v.line || N};--sw:${v.sw};--exo:${v.exo};--glass:${O};`;
  ROLES.forEach(r => { const [f, st] = v[r]; s += `--${r}-f:${m[f] || f};--${r}-s:${m[st] || st};`; });
  return s;
}
const defs = (uid) => `<defs>
<pattern id="ht-${uid}" width="5" height="5" patternUnits="userSpaceOnUse"><rect width="5" height="5" fill="${'#fff'}" opacity="0"/><circle cx="1.4" cy="1.4" r="1" fill="var(--line)"/><circle cx="3.9" cy="3.9" r="1" fill="var(--line)"/></pattern>
<pattern id="st-${uid}" width="22" height="22" patternUnits="userSpaceOnUse" patternTransform="rotate(-62)"><rect width="22" height="22" fill="#fff"/><rect width="9" height="22" fill="var(--line)"/></pattern>
</defs>`;

/* ---- pieces ---- */
const P = (role, d, x = '') => `<path class="r-${role}" d="${d}" ${x}/>`;
function ext(x, y, w, h, dx = 120, dy = 150) {
  return `<g class="ex">` + P('ext', `M${x} ${y}L${x} ${y + h}L${x - dx} ${y + h + dy}L${x - dx} ${y + dy}Z`) +
    P('ext2', `M${x} ${y + h}L${x + w} ${y + h}L${x + w - dx} ${y + h + dy}L${x - dx} ${y + h + dy}Z`) + `</g>`;
}
function win(x, y, w, h, inner) {
  return ext(x, y, w, h) + `<rect class="r-ui" x="${x}" y="${y}" width="${w}" height="${h}" rx="12"/>` +
    P('bar', `M${x} ${y + 32}L${x} ${y + 12}Q${x} ${y} ${x + 12} ${y}L${x + w - 12} ${y}Q${x + w} ${y} ${x + w} ${y + 12}L${x + w} ${y + 32}Z`) +
    `<path class="ln" d="M${x} ${y + 32}H${x + w}"/>` + [0, 1, 2].map(i => `<circle class="fl" cx="${x + 20 + i * 17}" cy="${y + 16}" r="4.2"/>`).join('') + inner;
}
function tag(x, y) {
  return `<g><rect class="r-tag" x="${x}" y="${y}" width="112" height="36" rx="18"/><circle class="bgr" cx="${x + 18}" cy="${y + 18}" r="5.5" style="stroke:var(--line);stroke-width:var(--sw)"/>` +
    `<path class="ln" d="M${x + 38} ${y + 24}C${x + 44} ${y + 8} ${x + 50} ${y + 8} ${x + 54} ${y + 22}C${x + 58} ${y + 8} ${x + 66} ${y + 8} ${x + 70} ${y + 22}C${x + 76} ${y + 12} ${x + 88} ${y + 10} ${x + 98} ${y + 14}" style="stroke-width:2"/></g>`;
}
function hand() {
  return P('skin2', 'M-20 -4C-22 -22 18 -26 22 -6C26 12 16 22 0 22C-14 22 -19 10 -20 -4Z') +
    `<path class="ln" d="M-7 -2V10M3 -2V12M12 -2V10" style="stroke-width:2"/>`;
}
function sander() {   // orbital sander seen from the side, base at y=0
  return P('paper', 'M-64 0H64V9Q64 11 62 11H-62Q-64 11 -64 9Z') +
    P('obj2', 'M-60 -12H60Q62 -12 62 -10V0H-62V-10Q-62 -12 -60 -12Z') +
    P('obj2', 'M54 -50H80Q86 -50 86 -44V-20Q86 -14 80 -14H54Z') + `<path class="ln" d="M66 -42V-22M74 -42V-22" style="stroke-width:2"/>` +
    P('obj', 'M-50 -12C-50 -50 -32 -64 -8 -64H24C48 -64 56 -46 56 -12Z') +
    P('obj', 'M-26 -62C-30 -90 -4 -98 10 -96C32 -94 34 -76 30 -62Z') +
    `<circle class="r-ui" cx="-30" cy="-32" r="6.5"/>`;
}
function head(o) {
  const hairBack = { bob: 'M-54 44C-72 -30 -44 -86 4 -86C54 -86 70 -30 54 44L46 76H-46Z', long: 'M-56 70C-74 -30 -46 -86 4 -86C56 -86 74 -30 56 70L60 170H-60Z', short: '' }[o.hair];
  const hairFront = { bob: 'M-44 -10C-44 -50 -22 -68 6 -68C32 -68 46 -50 46 -22C32 -30 12 -40 -4 -54C-12 -36 -30 -24 -44 -10Z',
    long: 'M-44 -8C-42 -52 -22 -68 4 -68C30 -68 46 -52 44 -8C32 -34 12 -48 0 -56C-12 -42 -30 -26 -44 -8Z',
    short: 'M-46 -4C-52 -60 -22 -80 8 -78C42 -76 58 -52 46 -8C36 -26 22 -42 4 -48C-10 -32 -28 -20 -46 -4Z' }[o.hair];
  const sm = o.smile ? 'M-12 28Q2 42 16 27' : 'M-10 31Q2 37 14 30';
  return (hairBack ? P('hair', hairBack) : '') +
    P('skin2', 'M-15 40V94C-15 110 15 110 15 94V40Z') +
    P('skin', 'M-42 -8C-42 -50 -24 -68 2 -68C28 -68 44 -50 44 -12C44 30 26 54 0 54C-26 54 -42 28 -42 -8Z') +
    `<g class="ln" style="stroke-width:calc(var(--sw)*.8)"><path d="M-28 -12L-8 -18M10 -18L30 -13"/><path d="M2 -4L-4 16L7 16"/><path d="${sm}"/></g>` +
    `<circle class="fl" cx="-16" cy="-4" r="3.4"/><circle class="fl" cx="18" cy="-4" r="3.4"/>` +
    (o.glasses ? `<circle class="gl" cx="-16" cy="-3" r="11"/><circle class="gl" cx="18" cy="-3" r="11"/><path class="gl" d="M-5 -4Q1 -8 7 -4"/>` : '') +
    P('hair', hairFront) + (o.hair === 'short' ? '' : '');
}
function body() {
  return P('top', 'M-104 330V168C-104 118 -60 90 0 90C60 90 104 118 104 168V330Z') +
    P('top2', 'M-30 92C-14 112 14 112 30 92L22 84C10 98 -10 98 -22 84Z');
}
/* the person holding the sander up on the right, in scene coordinates */
function holder(o, mirror) {
  const g = `<g transform="translate(185 148) scale(1.1)">${body()}${head(o)}</g>` +
    P('top2', 'M232 500H300C316 444 342 404 358 346L316 328C292 380 262 430 232 500Z') +
    `<g transform="translate(346 440) rotate(-6) scale(1.25)">${sander()}</g>` +
    `<g transform="translate(333 326) rotate(-8)">${hand()}</g>`;
  return mirror ? `<g transform="translate(805 0) scale(-1 1)">${g}</g>` : g;
}
const chip = (x, y, w, h, role, label, tw, on) => `<rect class="r-${role}" x="${x}" y="${y}" width="${w}" height="${h}" rx="10"/><text class="${tw ? 'tw' : ''}" x="${x + 16}" y="${y + h / 2 + 5.5}" font-size="16">${label}</text>` +
  (on ? `<circle cx="${x + w - 22}" cy="${y + h / 2}" r="10" fill="#fff"/><path d="M${x + w - 27} ${y + h / 2}l4 4 7-8" fill="none" stroke="${B}" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>` : '');
const tick = (x, y, s = 1) => `<path d="M${x} ${y}l${6 * s} ${6 * s} ${12 * s}-${14 * s}" fill="none" stroke="#fff" stroke-width="${3 * s}" stroke-linecap="round" stroke-linejoin="round"/>`;

const SCENES = {
  ask: { label: 'Ask', alt: 'A person holds up an orbital sander next to a support screen asking what the sander is doing, with scratching selected',
    svg: () => tag(300, 44) + win(420, 76, 340, 300,
      chip(444, 122, 250, 46, 'soft', 'What is your sander doing?') +
      chip(444, 186, 292, 42, 'ui1', 'Scratching the surface', true, true) +
      chip(444, 238, 292, 42, 'soft', 'Vibrating or wobbling') +
      chip(444, 290, 292, 42, 'soft', 'Won’t start')) +
      `<g><rect class="r-ui" x="712" y="318" width="76" height="76" rx="12"/><circle class="ln" cx="750" cy="356" r="25"/><circle class="ln" cx="750" cy="356" r="13"/>` +
      P('ui2', 'M752 354L774 330L786 328L784 340L760 362Z') + `<circle class="fl" cx="750" cy="356" r="3.4"/></g>` +
      holder({ hair: 'bob' }) },
  check: { label: 'Check', alt: 'A person with glasses holds up a worn sanding pad next to a checklist screen',
    svg: () => tag(318, 40) + win(430, 66, 330, 320,
      `<text x="456" y="124" font-size="19">Check the pad</text>` +
      [['Pad is worn or clogged', true], ['Grit matches the job', true], ['Dust holes line up', false]].map((r, i) => {
        const y = 146 + i * 62;
        return `<rect class="r-soft" x="452" y="${y}" width="286" height="50" rx="10"/><rect class="${r[1] ? 'r-ui1' : 'r-ui'}" x="466" y="${y + 13}" width="24" height="24" rx="6"/>` +
          (r[1] ? tick(471, y + 26, .8) : '') + `<text x="504" y="${y + 31}" font-size="16">${r[0]}</text>`;
      }).join('')) +
      `<g transform="translate(185 148) scale(1.1)">${body()}${head({ hair: 'short', glasses: true })}</g>` +
      P('top2', 'M226 500H292C300 450 306 420 316 392L276 378C256 420 240 456 226 500Z') +
      `<g transform="translate(332 318)"><circle class="r-obj" r="80"/><circle class="r-paper" r="62"/><circle class="r-obj2" r="40"/>` +
      [0, 1, 2, 3, 4, 5].map(i => { const a = i * Math.PI / 3 + .5; return `<circle class="bgr" cx="${(Math.cos(a) * 24).toFixed(1)}" cy="${(Math.sin(a) * 24).toFixed(1)}" r="6.5" style="stroke:var(--line);stroke-width:2"/>`; }).join('') +
      `<circle class="r-ui" r="9"/><path class="ln" d="M-48 -34L-20 -52M30 -56L52 -36M-56 12L-40 34M40 30L56 10" style="stroke-width:2.4"/></g>` +
      `<g transform="translate(322 394) rotate(-12)">${hand()}</g>` },
  solved: { label: 'Solved', alt: 'A smiling person holds up the sander beside a rising bar chart and a big check mark',
    svg: () => tag(420, 36) + win(36, 96, 330, 290,
      `<text x="60" y="152" font-size="19">Finish quality</text>` +
      `<path class="ln" d="M60 346H340" style="stroke-width:2"/>` +
      [[70, 60], [150, 110], [230, 170]].map(b => `<rect class="r-ui1" x="${b[0]}" y="${346 - b[1]}" width="56" height="${b[1]}"/>`).join('') +
      `<path class="ln" d="M70 300C84 262 124 252 150 252M160 238C176 190 214 178 236 190M240 176C258 130 296 118 312 130" style="stroke-width:2.2;stroke-dasharray:7 7"/>`) +
      `<g><rect class="r-ui1" x="296" y="56" width="92" height="92" rx="8"/><path d="M322 102l16 18 34-44" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/></g>` +
      holder({ hair: 'long', smile: true }, true) }
};

/* returns one standalone svg. opts: { variant: key | tokens object, texture, id } */
function sceneSVG(scene, v, texture = true) {
  const uid = ++UID, S = SCENES[scene];
  return `<svg class="sc" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" style="${tokenStyle(v, uid, texture)}" role="img" aria-label="${S.alt}">` +
    defs(uid) + `<rect class="bgr" width="800" height="500"/>${S.svg()}</svg>`;
}


const SW = { white: W, off: '#F6F5F3', light: LB, med: MB, yellow: Y, orange: O, navy: N };
const AA = { blue: B, orange: O, navy: N }, AB = { orange: O, blue: B, yellow: Y, navy: N };
const DEF = { variant: 'mono', scene: 'ask', bg: 'auto', a: 'auto', b: 'auto', sw: null, tex: true, shd: true };
const S = Object.assign({}, DEF);
const $ = (id) => document.getElementById(id);
document.getElementById('roles').textContent = ROLE_CSS;
(() => { const h = new URLSearchParams(location.hash.slice(1)); if (VARIANTS[h.get('style')]) S.variant = h.get('style'); if (SCENES[h.get('scene')]) S.scene = h.get('scene'); })();

function tokens(key, tweaks) {
  const v = JSON.parse(JSON.stringify(VARIANTS[key]));
  if (tweaks) {
    if (S.bg !== 'auto') v.bg = SW[S.bg];
    if (S.a !== 'auto') { if (v.top[0] === B) v.top[0] = AA[S.a]; v.ui1[0] = AA[S.a]; v.ext2[0] = v.ext2[0] === MB ? AA[S.a] : v.ext2[0]; }
    if (S.b !== 'auto') { v.obj[0] = AB[S.b]; v.tag[0] = v.tag[0] === Y ? v.tag[0] : AB[S.b]; if (v.ui2[0] !== 'none') v.ui2[0] = AB[S.b]; }
    if (S.sw) v.sw = S.sw;
  }
  v.exo = S.shd ? 1 : 0;
  return v;
}
const cur = () => sceneSVG(S.scene, tokens(S.variant, true), S.tex);
const mk = (id, items, fn, cls) => { $(id).innerHTML = items.map(([k, label, extra]) => `<button type="button" data-k="${k}" ${cls ? `class="${extra === 'auto' ? 'auto' : ''}" style="${extra && extra !== 'auto' ? 'background:' + extra : ''}" aria-label="${label}" title="${label}"` : ''}>${cls ? '' : label}</button>`).join(''); $(id).onclick = (e) => { const b = e.target.closest('button'); if (b) { fn(b.dataset.k); render(); } }; };
mk('scenes', Object.keys(SCENES).map(k => [k, SCENES[k].label]), k => S.scene = k);
mk('looks', Object.keys(VARIANTS).map(k => [k, VARIANTS[k].label]), k => S.variant = k);
mk('bgs', [['auto', 'Look default', 'auto']].concat(Object.keys(SW).map(k => [k, k, SW[k]])), k => S.bg = k, 1);
mk('accA', [['auto', 'Look default', 'auto']].concat(Object.keys(AA).map(k => [k, k, AA[k]])), k => S.a = k, 1);
mk('accB', [['auto', 'Look default', 'auto']].concat(Object.keys(AB).map(k => [k, k, AB[k]])), k => S.b = k, 1);
$('sw').oninput = (e) => { S.sw = +e.target.value; render(); };
$('tex').onchange = (e) => { S.tex = e.target.checked; render(); };
$('shd').onchange = (e) => { S.shd = e.target.checked; render(); };
$('reset').onclick = () => { Object.assign(S, DEF, { variant: S.variant, scene: S.scene }); render(); };
$('grid').onclick = (e) => { const c = e.target.closest('.card'); if (c) { S.variant = c.dataset.k; render(); } };

function render() {
  const pr = (id, key) => $(id).querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b.dataset.k === key));
  pr('scenes', S.scene); pr('looks', S.variant); pr('bgs', S.bg); pr('accA', S.a); pr('accB', S.b);
  $('note').textContent = VARIANTS[S.variant].note;
  $('sw').value = S.sw || VARIANTS[S.variant].sw; $('tex').checked = S.tex; $('shd').checked = S.shd;
  $('stage').innerHTML = cur();
  $('grid').innerHTML = Object.keys(VARIANTS).map(k => `<button type="button" class="card" data-k="${k}" aria-pressed="${k === S.variant}"><span class="th">${sceneSVG(S.scene, tokens(k, false), S.tex)}</span><b>${VARIANTS[k].label}</b></button>`).join('');
  $('use').href = '../sander-troubleshoot-flow/?style=' + S.variant;
  history.replaceState(null, '', '#style=' + S.variant + '&scene=' + S.scene);
}
function standalone() {
  const svg = $('stage').firstElementChild.cloneNode(true);
  svg.insertAdjacentHTML('afterbegin', '<style>' + ROLE_CSS + '</style>');
  return new XMLSerializer().serializeToString(svg);
}
function save(blob, name) { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); }
$('svg').onclick = () => save(new Blob([standalone()], { type: 'image/svg+xml' }), 'sander-' + S.scene + '-' + S.variant + '.svg');
$('png').onclick = () => {
  const img = new Image(); img.onload = () => { const c = document.createElement('canvas'); c.width = 1600; c.height = 1000; c.getContext('2d').drawImage(img, 0, 0, 1600, 1000); c.toBlob(b => save(b, 'sander-' + S.scene + '-' + S.variant + '.png')); };
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(standalone());
};
render();
</script>
</body>
</html>

  if (sp < 1) { ctx.globalAlpha = fade * (1 - sp); ctx.fillRect(px, T, pw, (B - T) * pa); }
  // scene B: yellow block top-left, outlined block top-right, cream block bottom-right
  if (sp > 0) {
    const cx = W * 0.5, cy = T + (B - T) * 0.5, x0 = W * 0.22;
    ctx.globalAlpha = fade * sp;
    ctx.fillRect(x0, T, cx - x0, cy - T);
    ctx.strokeRect(cx + lw / 2, T + lw / 2, R - cx - lw, cy - T - lw);
    ctx.globalAlpha = fade; ctx.fillStyle = cream; ctx.fillRect(cx, cy, R - cx, (B - T) * 0.5 * sp);
  }
  ctx.restore();
}
function drawCalligraphy(ctx, W, H, t, still) {
  ctx.fillStyle = YEL; ctx.fillRect(0, 0, W, H);
  flourish(ctx, 0, 0, W, H, { color: DARK, t, still, fw: 1.2 * (W / 2000 < 0.7 ? 1 : 1) * 1.1 });
}

const surfaces = [];
function surface(cv, W, H, draw) {
  const s = { cv, ctx: cv.getContext('2d'), W, H, draw, k: 1 };
  s.fit = () => { const r = cv.getBoundingClientRect(); if (!r.width) return; const dpr = Math.min(devicePixelRatio || 1, 2), w = Math.round(r.width * dpr); if (cv.width !== w) { cv.width = w; cv.height = Math.round(w * H / W); } s.k = cv.width / W; };
  s.fit(); surfaces.push(s); return s;
}
let clock = 0, last = performance.now();
function loop(now) {
  const dt = Math.max(0, Math.min(0.1, (now - last) / 1000)); last = now; if (!reduce) clock += dt;
  const t = frozen != null ? frozen : reduce ? STILL_T : clock;
  for (const s of surfaces) { s.ctx.setTransform(1, 0, 0, 1, 0, 0); s.ctx.clearRect(0, 0, s.cv.width, s.cv.height); s.ctx.setTransform(s.k, 0, 0, s.k, 0, 0); s.draw(s.ctx, s.W, s.H, t % (PERIOD * 100), frozen != null || reduce); }
  requestAnimationFrame(loop);
}
surface(document.getElementById('cNum'), 1000, 1000, drawNumbers);
surface(document.getElementById('cFw'), 1000, 1000, drawFramework);
surface(document.getElementById('cCal'), 1000, 1000, drawCalligraphy);
addEventListener('resize', () => surfaces.forEach((s) => s.fit()));
requestAnimationFrame(loop);
</script>
</body>

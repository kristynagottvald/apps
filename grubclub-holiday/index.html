<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grubclub Holiday Grid</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#0E3251;--deep:#082440;--egg:#D7F5FA;--kiwi:#EEFB71;--line:rgba(215,245,250,.16)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000}
body{display:flex;flex-direction:column;font-family:Poppins,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;color:var(--egg)}
/* ---------- Back nav (shared across all sandbox projects) ---------- */
nav.back{box-sizing:border-box;flex:none;display:flex;align-items:center;gap:8px;height:49px;padding:0 20px;background:#000;border-bottom:1px solid #1c1c1c;font:400 13px/1.35 "Inter","Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
nav.back a{color:#8d8d8d;text-decoration:none}
nav.back a:hover,nav.back a:focus-visible{color:#fff;text-decoration:underline;text-underline-offset:3px}
nav.back span{color:#6e6e6e}
nav.back b{font-weight:500;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:640px){nav.back{padding:0 16px}}

main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 400px}
.left{position:relative;background:var(--deep);display:flex;flex-direction:column;min-height:0;padding:0 40px 24px}
.view{flex:1;min-height:0;position:relative;margin:24px 0 0}
#stage{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);box-shadow:0 30px 60px -28px rgba(0,0,0,.6);line-height:0}
#stage svg{display:block;width:100%;height:100%}
.panel{background:var(--navy);padding:0 26px 22px;overflow-y:auto;min-height:0;display:flex;flex-direction:column;scrollbar-width:thin;scrollbar-color:#2b5575 transparent}
.sec{padding:10px 0 11px;border-bottom:1px solid var(--line)}
.sec h2{margin:0 0 10px;font-size:12.5px;font-weight:600;letter-spacing:.08em;color:#fff;display:flex;justify-content:space-between;align-items:baseline}
.sec h2 em{font-style:normal;font-weight:500;color:var(--egg);opacity:.7;letter-spacing:0;font-size:12px}
.sec p{margin:0 0 10px;font-size:11.5px;line-height:1.5;color:rgba(215,245,250,.7)}
.row{display:flex;gap:8px}
.opt{flex:1;height:38px;border-radius:6px;border:1.5px solid transparent;background:rgba(0,0,0,.22);color:var(--egg);font:500 13px/1 Poppins,sans-serif;cursor:pointer;display:grid;place-items:center;transition:background .2s}
.opt:hover{background:rgba(0,0,0,.34)}
.opt[aria-pressed=true]{border-color:#fff;background:rgba(0,0,0,.3);color:#fff}
.opt:focus-visible,#txt:focus-visible,#shuf:focus-visible,.dl:focus-visible{outline:2px solid var(--kiwi);outline-offset:2px}
.sw{height:40px}
.sw i{width:30px;height:30px;border-radius:4px;display:block;border:1px solid rgba(255,255,255,.25)}
#txt{width:100%;height:40px;border-radius:6px;border:0;background:rgba(0,0,0,.28);color:#fff;font:500 14px Poppins,sans-serif;padding:0 18px;letter-spacing:.06em}
#txt::placeholder{color:rgba(215,245,250,.4)}
#shuf{width:100%;height:44px;border-radius:24px;border:0;background:var(--kiwi);color:#0E3251;font:600 14px Poppins,sans-serif;cursor:pointer;transition:transform .2s}
#shuf:hover{transform:scale(1.02)}
.dl{flex:1;height:40px;border-radius:22px;border:1.5px solid var(--egg);background:none;color:var(--egg);font:600 13px Poppins,sans-serif;cursor:pointer;transition:background .2s,color .2s}
.dl:hover{background:var(--egg);color:var(--navy)}
.pal{display:flex;gap:8px;margin-top:2px}
.pal span{flex:1;font-size:10.5px;text-align:center;color:rgba(215,245,250,.6)}
.pal i{display:block;height:26px;border-radius:50%;width:26px;margin:0 auto 5px;border:1px solid rgba(255,255,255,.2)}
.t{transform-box:fill-box;transform-origin:center;animation:pop .6s cubic-bezier(.2,.9,.3,1.2) both;animation-delay:var(--d,0s)}
@keyframes pop{from{opacity:0;transform:scale(.55)}to{opacity:1;transform:none}}
@media (max-width:900px){main{grid-template-columns:1fr;grid-template-rows:minmax(320px,55vh) auto}.left{padding:0 16px 16px}.panel{overflow:visible}}
@media (prefers-reduced-motion:reduce){.t{animation:none}}
</style>
</head>
<body>
<nav class="back" aria-label="Sandbox"><a href="../">Sandbox</a><span>/</span><a href="../">Back to all projects</a><span>/</span><b>Grubclub Holiday Grid</b></nav>
<main>
  <section class="left" aria-label="Preview">
    <div class="view" id="view"><div id="stage" role="img" aria-label="Holiday modular grid design"></div></div>
  </section>
  <aside class="panel">
    <div class="sec"><h2>SHAPE</h2>
      <div class="row" id="ratios">
        <button class="opt" data-r="16:9" aria-pressed="true">16:9</button>
        <button class="opt" data-r="9:16" aria-pressed="false">9:16</button>
        <button class="opt" data-r="1:1" aria-pressed="false">1×1</button>
        <button class="opt" data-r="3:4" aria-pressed="false">3:4</button>
      </div></div>
    <div class="sec"><h2>GRID <em id="gridNote"></em></h2>
      <div class="row" id="dens">
        <button class="opt" data-d="0" aria-pressed="false">Bold</button>
        <button class="opt" data-d="1" aria-pressed="true">Modular</button>
        <button class="opt" data-d="2" aria-pressed="false">Fine</button>
      </div></div>
    <div class="sec"><h2>WORDMARK</h2>
      <input id="txt" value="GRUBCLUB" maxlength="14" aria-label="Wordmark text" placeholder="GRUBCLUB"></div>
    <div class="sec"><h2>BORDER &amp; GUTTERS</h2>
      <div class="row" id="gut">
        <button class="opt sw" data-g="white" aria-pressed="true" aria-label="White"><i style="background:#fff"></i></button>
        <button class="opt sw" data-g="lime" aria-pressed="false" aria-label="Lime"><i style="background:#EEFB71"></i></button>
        <button class="opt sw" data-g="dark" aria-pressed="false" aria-label="Dark green"><i style="background:#0F5A5C"></i></button>
      </div></div>
    <div class="sec"><h2>PALETTE</h2>
      <div class="pal">
        <span><i style="background:#EEFB71"></i>Lime</span>
        <span><i style="background:#1C8859"></i>Medium</span>
        <span><i style="background:#0F5A5C"></i>Dark</span>
        <span><i style="background:#fff"></i>White</span>
      </div></div>
    <div class="sec" style="border:0">
      <button id="shuf">Shuffle the grid</button>
      <div class="row" style="margin-top:10px"><button class="dl" id="dPng">Download PNG</button><button class="dl" id="dSvg">Download SVG</button></div>
    </div>
  </aside>
</main>
<script>
(() => {
/* ---------- palette: Grubclub lime / kale / bean + white ---------- */
const C = { L: '#EEFB71', M: '#1C8859', D: '#0F5A5C', W: '#FFFFFF' };
const SIZE = { '16:9': [1920, 1080], '9:16': [1080, 1920], '1:1': [1080, 1080], '3:4': [1080, 1440] };
/* [cols, rows] per ratio and grid density (bold, modular, fine) */
const GRID = {
  '16:9': [[12, 7], [16, 9], [20, 11]],
  '9:16': [[7, 12], [9, 16], [11, 20]],
  '1:1':  [[8, 8], [12, 12], [16, 16]],
  '3:4':  [[6, 8], [9, 12], [12, 16]]
};
const S = { ratio: '16:9', dens: 1, gut: 'white', word: 'GRUBCLUB', seed: 7 };

/* the Grubclub logo worm (same PNG the other Grubclub apps use as the logo mark), 131x112 */
const WORM_PNG = 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAIMAAABwCAYAAAA9m8PRAAAHn0lEQVR4nO2de4hXRRTHP9vDKK2s1srKwoqytuy5mT1E7V0oREZQVmZkob2LqMAIikKC7KlFRZEa9iSMHittFmU+sAeSpIllapC1mGSZZdv2x9HLZjv38bv3zpn72/OB/efO3DmH3/3u3DNzZ840dHR0YBgA22k7YISDicGIMDEYESYGI8LEYETsoO2AEcuxwCigGWgCegK9gX+ANUAb0AK8ASzKa6zBhpbBcTpwNXBlDfe+DowD1tVi2MQQDnsg/+FDC2hrBnAF0oOkxmKGMLgc+W8eWlB7lwHtwOgsN5kY9LkLeLGktqcBF6WtbGLQ5UbggZJtvAbcm6aixQx6jAWe82jvTKA1roKJQQ+NH74HsNlVaK8JHR5SsntTXKH1DDqsQ4aSGjS4Cqxn8M849IQAMqvZJSYG/9Qys1gk410FJgb/HKBs/1xXgcUMfmkCvtJ2AkfcYD2DEWFiMCJMDEaExQz+2QjsrOyDxQyB8Luy/cWuAhODf2Yr23/SVWBi8M9MZfvvuQosZtBhLbC3gt0lwFGuQusZdLhUye6EuEITgw6twPuebc4EPoqrYK8JXf5EFpz4YA9gfVwF6xl0OdSDjV+B/iQIAUwM2qwG9gS+Kan9NmRTzso0lU0M+vwCHAk8XnC7U4D9iJlk2hYTQxi0I8vmm4E3c7b1+pZ2JhCz+LUrLIAMk52QXVaXIEvck5gLPAqsAD6v1aiJoRrsDhyMTFQdCvyIxAFrkAmsQjAxGBEWMxgRJgYjwsRgRJgYjAgTgxFRbwm+eiBDr92ARmBXZE6+s+g3I+PxFb6dC52qi+EIJHfRicBA5Mvcjinv3Yh8xFmOZEx7lgLH7FWkivMM2yPf5keV1P79wGPAzyW1HyxVEsMwJK/BCZ7s/QqcA8z3ZE+dKoihF5IS7ywl+5uRzaofKNn3RuijifHABvSEABKDtALvKvrghVB7hp2Q/QVDtB3pgpHAWwW0MwkYA/zBf3c4ZUrkmUADkjuqD/JZ++u4yiGOJvoBC4F9tR1xMAu4D7gnZztD8btcfgAJYgjtNTEEWEW4QtjKROCVnG30KsKRDGxKqhCSGM4jYSl3YFwMLEWGurXgTLRVEonxQChi6A28o+1EDRwOfKrtRFGEIIY+VHuC5yQkR3PlCUEMswkzkM3CaGCEthN50RbDFcTkJawYs9DN75gbTTH0AZ5RtF8Gr2k7kAdNMUzC3z5DXwwHDtN2ola0xHAwcJWS7bKZl7JekTONaWhPqqAlhluU7PpgT9JtfAkODTE0ANcr2PXJI9oO1IKGGEYq2PRNE/KNpVJoiGGigk0Nko4c0h7W/w8Nh3ytVNLmOG0HsuJbDKd4tqdJI/qZYDPhWwyXebanTaWGz77F0F1eEVs5OaYsuCVmvsVwiGd72hyv7UAWfIuh0bM9bZq0HchC1T8dp2EeslPqaLpfz5SJ4Ma6BfM4MoK5ENmDWXRGtTTs4rj+i1cvUlDPYpiDZFDrzI0E+BA8kfisfYphgEdbAC84rqfOi9jd8CkG32NuVwo832soXKugfa+OTsSnGO7waAvc6wV8ryNodlyvdYl9rQTzmljmyU5nfnNc952D4S7H9UFevXD/HhE+xPAFOkvB1jmur/bqBZyN7K0YgZwCczywwLMPkCJwLnOe4WZgcontJ+E6JU5jj8ZgZPW0Jok9Q1Fi2BUZx/cDbgdOQz9Acs39/+DVizBoB/5OquQSw/Atf+uRB9z5h90A7IVsjm1EDrbYH/2H35mlNZbVK98heaZjcYnhEmBcoe74Je7syAXAT+icHqfFkjSVXAGkK/iqCgtjyjrofr3Dd2kqucTQuzg/VJiRUB6btKIOeSlNJZcYglt4kYEPU9R5uWwnAmIjkusykXr8UPVoijpzSPkerQPeJsXJdVCfYkh78HhLqV6EQ+qUhS4xhDRMzMI0pFtMw5QyHQmE9cBTaSvXW8/waoa6K4gfddQDmQ4vc4mhiiL5hOz5GS8ow5GAuC1L5So+dBdjarinjfrN/DoP+DLLDfUSM0yl9vMjzi/SkYDIvGGpHnqGTUiO6TzkzfYaGtNJOevYGZcYfK/CycOpBbRxH/V1lMDltdxU9Z5hEjmO+92GYQW1o83gWm+scszQAtxZYHubCD9ndRKTydHDVbVnmIMcCFI0a5ENN1WkBbg1TwNVFMNqZOFNWbxJ9RJ0tVDAP0fVvlouBg70YKeVHO9ezxQiBHCLITFnoALXAcd4tDcfiZ1WebSZlecp8HVZhQDyY2T39NNK9g8CHlSyHccNwNgiGwx5nmE+Ml4eAnyr7MvdyN6PEOYiZiMZdp8ouuEQP1StBG5C3tnTFf3YluWITxeRfs1EkSwDrkHO2sw8u5iGkHqGz5D59P7IibOh8gbyQAbiJ9/DcuBaZBf7s2Uach1lOBUJ2MpmCfAwMBed/ZhF0IAk8hqJnJ+xXwFttiEP/j08ntsVd67lecAZSPC2D/Ke2pt8weVS5EyGt5Fp5L9ytBUqPZD/4mbkDKtBQF+kx+tqn8paZLX2IuT3ScosWxp5Djntieyo6tu5PeRH+BmZHGpDDvH8PoePhidCPfHWUKCK09FGSZgYjAgTgxFhYjAi/gXiq0oVv7E2yQAAAABJRU5ErkJggg==';

/* ---------- seeded random ---------- */
const rngOf = (s) => { let a = s >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; };
const pick = (r, a) => a[Math.floor(r() * a.length)];
const f = (n) => +n.toFixed(2);

/* ---------- icons, drawn in a 100x100 box. k = {bg, a (main), b (second tone), x (accent)} ---------- */
let uid = 0;
const circ = (cx, cy, r, fill, extra = '') => `<circle cx="${f(cx)}" cy="${f(cy)}" r="${f(r)}" fill="${fill}" ${extra}/>`;
/* soft wave line (the thin wavy detail from the references): n wavelengths between x0 and x1 */
const zig = (x0, x1, y, amp, n, col, w) => { const wl = (x1 - x0) / n; let d = `M${f(x0)} ${f(y)} Q${f(x0 + wl / 4)} ${f(y - amp)} ${f(x0 + wl / 2)} ${f(y)}`; for (let i = 1; i < n * 2; i++) d += ` T${f(x0 + wl / 2 * (i + 1))} ${f(y)}`; return `<path d="${d}" fill="none" stroke="${col}" stroke-width="${w}" stroke-linecap="round"/>`; };
const line = (d, col, w = 3) => `<path d="${d}" fill="none" stroke="${col}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/>`;
const rot = (deg, cx, cy, s) => `<g transform="rotate(${deg} ${cx} ${cy})">${s}</g>`;
const leaf = (cx, cy, len, wid, deg, fill, vein) => rot(deg, cx, cy, `<path d="M${cx} ${cy} Q${cx + len * .45} ${cy - wid} ${cx + len} ${cy} Q${cx + len * .45} ${cy + wid} ${cx} ${cy}Z" fill="${fill}"/>` + (vein ? `<path d="M${cx + 6} ${cy} H${cx + len - 8}" stroke="${vein}" stroke-width="2.4" stroke-linecap="round"/>` : ''));
const halfL = (cx, cy, r, fill) => `<path d="M${cx} ${cy - r} A${r} ${r} 0 0 0 ${cx} ${cy + r}Z" fill="${fill}"/>`;
const halfR = (cx, cy, r, fill) => `<path d="M${cx} ${cy - r} A${r} ${r} 0 0 1 ${cx} ${cy + r}Z" fill="${fill}"/>`;
const poly = (pts, fill) => `<polygon points="${pts.map((p) => p.map(f).join(',')).join(' ')}" fill="${fill}"/>`;
const splitCircle = (k, r = 46) => halfL(50, 50, r, k.a) + halfR(50, 50, r, k.b);

/* chunky worm-line squiggle: arches of semicircles drawn with a thick round-capped stroke (bleeds off the tile) */
const archWave = (x0, y, r, n, col, sw, flip) => { let d = `M${f(x0)} ${f(y)}`; for (let i = 0; i < n; i++) d += ` A${f(r)} ${f(r)} 0 0 ${(i + (flip ? 1 : 0)) % 2 ? 0 : 1} ${f(x0 + 2 * r * (i + 1))} ${f(y)}`; return `<path d="${d}" fill="none" stroke="${col}" stroke-width="${f(sw)}" stroke-linecap="round"/>`; };
const contrastOf = (c1, c2) => { const a = lum(c1), b = lum(c2); return (Math.max(a, b) + .05) / (Math.min(a, b) + .05); };
/* the palette colour from pool that contrasts most with the surface a detail sits on */
const bestOn = (surface, pool) => pool.filter((c) => c !== surface).sort((u, v) => contrastOf(v, surface) - contrastOf(u, surface))[0];
/* candy cane colours: dark body with lime stripes wherever dark green reads against the tile (lime tiles get white stripes so they do not vanish); on green tiles, the highest-contrast body and the best stripe colour against it */
const caneCols = (bg) => { if (contrastOf(C.D, bg) >= 3) return [C.D, bg === C.L ? C.W : C.L]; const all = Object.values(C), body = all.filter((c) => c !== bg).sort((u, v) => contrastOf(v, bg) - contrastOf(u, bg))[0], stripe = all.filter((c) => c !== bg && c !== body).sort((u, v) => contrastOf(v, body) - contrastOf(u, body))[0]; return [body, stripe]; };
const squigCols = (k) => [k.a, k.b, k.x].sort((u, v) => contrastOf(v, k.bg) - contrastOf(u, k.bg));

const ICON = {
  /* thin cap and loop, big round bauble, split tone or wavy diagonal lines */
  ornament: (k, v) => { const id = 'oc' + (uid++); return `<rect x="41" y="11" width="18" height="11" rx="1.5" fill="${k.b}"/>` + line('M44 12 V8 A6 6 0 1 1 56 8 V12', k.x, 3) +
    (v ? halfL(50, 61, 38, k.a) + halfR(50, 61, 38, k.b) + zig(14, 86, 56, 5, 6, k.bg, 2.6) + zig(14, 86, 68, 5, 6, k.bg, 2.6) :
      `<clipPath id="${id}"><circle cx="50" cy="61" r="38"/></clipPath>` + circ(50, 61, 38, k.a) + `<g clip-path="url(#${id})"><g transform="rotate(-40 50 61)">${[-10, 10, 30, 50, 70, 90].map((y) => zig(-20, 120, y + 20, 4, 8, k.bg, 2.6)).join('')}</g></g>`); },
  /* pentagon face, ring antlers, one round nose */
  reindeer: (k) => { const ant = Object.values(C).filter((c) => c !== k.a && c !== k.bg).sort((u, v) => Math.min(contrastOf(v, k.bg), contrastOf(v, k.a)) - Math.min(contrastOf(u, k.bg), contrastOf(u, k.a)))[0]; /* antler rings: big, thick, bleeding off the top and side edges, in the colour that reads best on both the tile and the head */
    return circ(7, 7, 25, 'none', `stroke="${ant}" stroke-width="5"`) + circ(93, 7, 25, 'none', `stroke="${ant}" stroke-width="5"`) +
      poly([[10, 22], [90, 22], [90, 64], [50, 100], [10, 64]], k.a) + circ(50, 70, 11, bestOn(k.a, [k.bg, k.b, k.x])); },
  /* bell: big dome, wavy white band, round clapper below */
  bell: (k) => `<path d="M16 68 V50 Q16 8 50 8 Q84 8 84 50 V68Z" fill="${k.a}"/><rect x="6" y="66" width="88" height="16" fill="${k.b}"/>` + zig(6, 94, 74, 3.4, 8, k.bg, 2.4) + circ(50, 90, 11, k.x),
  hat: (k) => `<path d="M20 70 V58 Q20 22 50 22 Q80 22 80 58 V70Z" fill="${k.a}"/><rect x="10" y="68" width="80" height="18" rx="2" fill="${k.b}"/>` + zig(10, 90, 77, 3.4, 8, k.bg, 2.4) + circ(50, 14, 11, k.x),
  /* wrapped gift: full tile, ribbon cross, star bow */
  /* thick candy cane with diagonal stripes */
  cane: (k) => { const id = 'cm' + (uid++), d = 'M32 104 V42 A21 21 0 0 1 74 42 V54', [cb, cs] = caneCols(k.bg); k = { ...k, a: cb, b: cs }; return `<mask id="${id}"><path d="${d}" stroke="#fff" stroke-width="26" fill="none"/></mask><path d="${d}" stroke="${k.a}" stroke-width="26" fill="none"/><g mask="url(#${id})">${Array.from({ length: 16 }, (_, i) => `<path d="M-10 ${i * 17 - 10} L110 ${i * 17 - 70}" stroke="${k.b}" stroke-width="7"/>`).join('')}</g>`; },
  /* two candles, a tall and a short: each flame sits in its own round backdrop, striped bodies, bleeding off the bottom */
  candle: (k) => { const c1 = 'cd' + (uid++), c2 = 'cd' + (uid++), st = (x0, y0, w2, h2, col, id, n) => `<clipPath id="${id}"><rect x="${x0}" y="${y0}" width="${w2}" height="${h2}"/></clipPath><g clip-path="url(#${id})">${Array.from({ length: n }, (_, i) => `<path d="M${x0 - h2 + 2 + i * 12} ${y0 + h2 + 2} L${x0 + 2 + i * 12} ${y0 - 2}" stroke="${col}" stroke-width="4.2"/>`).join('')}</g>`, fl = (cx, y0, hh, ww, col, sw) => `<path d="M${cx} ${y0} Q${cx + ww} ${y0 + hh / 2} ${cx} ${y0 + hh} Q${cx - ww} ${y0 + hh / 2} ${cx} ${y0}Z" fill="none" stroke="${col}" stroke-width="${sw}" stroke-linejoin="round"/>`;
    return circ(29, 34, 29, k.a) + circ(76, 56, 19, k.a) +
      `<rect x="6" y="58" width="46" height="46" fill="${k.a}"/>` + st(6, 58, 46, 46, k.b, c1, 8) +
      `<rect x="60" y="72" width="32" height="32" fill="${k.b}"/>` + st(60, 72, 32, 32, k.a, c2, 6) +
      fl(29, 10, 30, 13, k.b, 3) + `<path d="M29 40 V58" stroke="${k.b}" stroke-width="3" stroke-linecap="round"/>` +
      fl(76, 41, 20, 9, k.b, 2.8) + `<path d="M76 61 V72" stroke="${k.b}" stroke-width="2.8" stroke-linecap="round"/>`; },

  const gutC = { white: C.W, lime: C.L, dark: C.D }[S.gut];
  const cw = (W - gap * (cols + 1)) / cols, ch = (H - gap * (rows + 1)) / rows;
  const tiles = layout(cols, rows, r);
  let out = '', n = 0, last = '';
  const nextIcon = (geo = true) => { let name, tries = 0; do { name = pick(r, ICONS_FULL); tries++; } while ((name === last || usedRecent.slice(-3).includes(name) || (!geo && GEO[name])) && tries < 40); last = name; usedRecent.push(name); return name; };
  usedRecent = [];
  /* about half of the illustrations run tight to the tile edges (zoomed in, bleeding off), the rest keep a margin */
  const iconSvg = (name, k, x, y, w, h, pad) => { const sl = BLEED[name], tight = !sl && !GEO[name] && r() < .5; const p = sl || tight ? 0 : pad; const vb = tight ? '5 5 90 90' : '0 0 100 100'; return `<svg x="${f(x + p)}" y="${f(y + p)}" width="${f(w - p * 2)}" height="${f(h - p * 2)}" viewBox="${vb}" preserveAspectRatio="${sl ? 'xMidYMid slice' : 'xMidYMid meet'}" overflow="${sl || tight ? 'hidden' : 'visible'}">${ICON[name](k, r() < .5 ? 1 : 0)}</svg>`; };
  const clipId = (i) => `c${i}`;
  tiles.forEach((t, i) => {
    const x = gap + t.x * (cw + gap), y = gap + t.y * (ch + gap), w = t.w * cw + (t.w - 1) * gap, h = t.h * ch + (t.h - 1) * gap;
    const mn = Math.min(w, h);
    let body = '', k;
    if (t.kind === 'word') {
      k = scheme(r, 'L'); k = { ...k, bg: C.L, a: C.D, b: C.M, x: C.M };
      const txt = (S.word || 'GRUBCLUB').toUpperCase();
      const fs = Math.min(h * .4, (w - h * 2.9) / (txt.length * .74));
      body = `<text x="${f(x + w / 2)}" y="${f(y + h / 2)}" text-anchor="middle" dominant-baseline="central" font-family="Poppins,'Helvetica Neue',Arial,sans-serif" font-weight="600" font-size="${f(fs)}" letter-spacing="${f(fs * .14)}" fill="${C.D}">${txt.replace(/&/g, '&amp;').replace(/</g, '&lt;')}</text>`;
      /* the Grubclub worm on either side of the wordmark, recoloured dark green */
      const wh = h * .62, ww2 = wh * 131 / 112, wy = y + (h - wh) / 2;
      body += `<filter id="wmf" x="0" y="0" width="1" height="1"><feFlood flood-color="${C.D}"/><feComposite in2="SourceAlpha" operator="in"/></filter>` +
        `<image href="${WORM_PNG}" filter="url(#wmf)" x="${f(x + h * .3)}" y="${f(wy)}" width="${f(ww2)}" height="${f(wh)}"/>` +
        `<image href="${WORM_PNG}" filter="url(#wmf)" x="${f(x + w - h * .3 - ww2)}" y="${f(wy)}" width="${f(ww2)}" height="${f(wh)}"/>`;
    } else if (t.kind === 'hero') {
      k = scheme(r, pick(r, ['W', 'M', 'D', 'L']));
      const nm = pick(r, ['ornament', 'wreath', 'snowman', 'reindeer', 'gift', 'bell', 'hat', 'pinwheel', 'pinwheel', 'pinwheel', 'holly', 'holly', 'holly', 'treeTri', 'treeTri', 'treeTri']);
      usedRecent.push(nm); if (GEO[nm]) k = GEO[nm](r);
      body = iconSvg(nm, k, x, y, w, h, GEO[nm] ? 0 : mn * .05);
    } else if (t.kind === 'cane') {
      k = scheme(r);
      body = `<g transform="translate(${f(x)} ${f(y)})">${BANDS.caneSide(w, h, k, r)}</g>`;
    } else if (t.kind === 'band' && (t.w !== t.h)) {
      k = scheme(r);
      const name = pick(r, t.w > t.h ? WIDE : ['squiggle', 'zigzag', 'zigzag', 'stripes']);
      body = `<g transform="translate(${f(x)} ${f(y)})">${BANDS[name](w, h, k, r)}</g>`;
    } else if (t.kind === 'multi') {
      k = scheme(r);
      const m = Math.round(Math.max(t.w, t.h) / Math.min(t.w, t.h));
      for (let j = 0; j < m; j++) {
        const kk = j ? { ...k, a: k.b === k.bg ? k.a : k.b, b: k.a } : k;
        const nm = nextIcon(false);
        body += t.w > t.h ? iconSvg(nm, kk, x + j * w / m, y, w / m, h, mn * .05) : iconSvg(nm, kk, x, y + j * h / m, w, h / m, mn * .05);
      }
    } else if (t.kind === 'filler') {
      k = scheme(r);
      body = iconSvg(pick(r, FILLERS), k, x, y, w, h, mn * .08);
    } else {
      k = scheme(r);
      const nm = t.w >= 2 && t.w === t.h && r() < .6 ? pick(r, ['pinwheel', 'holly', 'treeTri']) : nextIcon(true); if (GEO[nm]) k = GEO[nm](r);
      body = iconSvg(nm, k, x, y, w, h, GEO[nm] ? 0 : mn * .05);
    }
    const dly = f(((t.x / cols + t.y / rows) * .9 + r() * .15));
    out += `<g ${anim ? `class="t" style="--d:${dly}s"` : ''}><clipPath id="${clipId(i)}"><rect x="${f(x)}" y="${f(y)}" width="${f(w)}" height="${f(h)}"/></clipPath><rect x="${f(x)}" y="${f(y)}" width="${f(w)}" height="${f(h)}" fill="${k.bg}"/><g clip-path="url(#${clipId(i)})">${body}</g></g>`;
    n++;
  });
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}"><rect width="${W}" height="${H}" fill="${gutC}"/>${out}</svg>`;
}

/* ---------- UI ---------- */
const stage = document.getElementById('stage'), view = document.getElementById('view');
function draw(anim = true) {
  stage.innerHTML = build(anim);
  document.getElementById('gridNote').textContent = GRID[S.ratio][S.dens].join(' × ') + ' modules';
  fit();
}
function fit() {
  const [W, H] = SIZE[S.ratio];
  const bw = view.clientWidth, bh = view.clientHeight;
  const sc = Math.min(bw / W, bh / H);
  stage.style.width = Math.floor(W * sc) + 'px'; stage.style.height = Math.floor(H * sc) + 'px';
}
addEventListener('resize', fit);
if (window.ResizeObserver) new ResizeObserver(fit).observe(view);
const group = (id, key, parse = (v) => v) => document.getElementById(id).addEventListener('click', (e) => {
  const b = e.target.closest('.opt'); if (!b) return;
  S[key] = parse(b.dataset[Object.keys(b.dataset)[0]]);
  document.querySelectorAll('#' + id + ' .opt').forEach((o) => o.setAttribute('aria-pressed', o === b ? 'true' : 'false'));
  draw(key !== 'gut');
});
group('ratios', 'ratio'); group('dens', 'dens', Number); group('gut', 'gut');
document.getElementById('txt').addEventListener('input', (e) => { S.word = e.target.value; draw(false); });
document.getElementById('shuf').addEventListener('click', () => { S.seed = Math.floor(Math.random() * 1e6); draw(true); });

const saveBlob = (blob, name) => { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); };
const fname = () => `grubclub-holiday-${S.ratio.replace(':', 'x')}`;
document.getElementById('dSvg').addEventListener('click', () => saveBlob(new Blob([build(false)], { type: 'image/svg+xml' }), fname() + '.svg'));
document.getElementById('dPng').addEventListener('click', () => {
  const [W, H] = SIZE[S.ratio];
  const img = new Image();
  img.onload = () => { const c = document.createElement('canvas'); c.width = W; c.height = H; c.getContext('2d').drawImage(img, 0, 0, W, H); c.toBlob((b) => saveBlob(b, fname() + '.png'), 'image/png'); };
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(build(false));
});

/* hooks for the home page clip recorder */
window.hg = { set(o) { Object.assign(S, o); draw(true); } };
draw(true);
})();
</script>
</body>
</html>

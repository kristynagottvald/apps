<style>
:root{--fg:#fff;--mute:#8c8c8c}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:#000;color:var(--fg);overflow:hidden;font:400 14px/1.4 "Inter","Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{display:flex;flex-direction:column}
/* ---------- Back nav (shared across all sandbox projects) ---------- */
nav.back{box-sizing:border-box;flex:none;display:flex;align-items:center;gap:8px;height:49px;padding:0 20px;background:#000;border-bottom:1px solid #1c1c1c;font:400 13px/1.35 "Inter","Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;white-space:nowrap}
nav.back a{color:#8d8d8d;text-decoration:none}

nav.back span{color:#6e6e6e}

main{flex:1;min-height:0;position:relative;overflow:hidden}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:pan-y}
canvas.drag{cursor:grabbing}
.copy{position:absolute;left:4.7vw;top:50%;transform:translateY(-50%);width:min(70vw,980px);pointer-events:none}
.logo{position:static;inset:auto;cursor:default;display:block;width:clamp(104px,11.5vw,180px);height:auto;aspect-ratio:1.4142/1.633;margin-bottom:clamp(16px,2.6vw,44px)}

.copy>*{animation:rise .9s cubic-bezier(.2,.7,.2,1) both}
.copy h1{animation-delay:.08s}.copy p{animation-delay:.18s}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.copy>*{animation:none}}
@media (max-width:760px){h1 br{display:none}.copy{top:7%;transform:none;width:calc(100% - 32px);left:16px}.logo{margin-bottom:20px}h1{font-size:clamp(26px,7.4vw,40px)}p{font-size:14px}}
</style>

<body>
<nav class="back" aria-label="Sandbox"><a href="../">Sandbox</a><span>/</span><a href="../">Back to all projects</a><span>/</span><b>ILG Pixel Globe</b></nav>
<main>
<canvas id="c" role="img" aria-label="A globe made of white pixels with glowing arcs of orders flying between warehouses and customers on every continent. Drag to turn it."></canvas>
<div class="copy">
  <canvas class="logo" id="logo" role="img" aria-label="ILG"></canvas>
  <h1>Get the guide navigating the<br>world’s inventory logistics</h1>
  <p>The Inventory Logistics Guide is a resource for founders that keeps your stock right-sized: forecast demand, replenish before the next shipment lands, and avoid overstocking and understocking.</p>
</div>
</main>
<script>
(()=>{
const B64="AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAADgAwAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA/v+P2f//AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAPD///////8/AAAAAAAAAAAAPAAAAAAAAAAAAAAAAAAA8P8P/////wcAAP8DAAAAAAB8AAAAAAAAAAAAAAAAAAEM/PP/////AwAAngEAAAAAAIAHAAAAAAAAAAAAAAAeBHL+wP////8DAAAAAAAAwAAAAP8AAAAAAAAAAAAAAOAf038AwP///wMAAAAAAAAPAID//wEAfAAAAAAAAAAAHwBwAAAA////AQAAAAAAwAEA/P//AAAAAAAAAAAAAID/Hzf/AwD+//8AAAAAAADgAC7+////D/gBAAABAAMAAPE/OP8/AP7//wAAAAAeAMAA/////////98BAADw/x//4/98OP4A/v9/AAAA4P8AABj//////////zt+A/z///9/ePw5/gH8/wcAAAD4/4/x/+////////////8/8P///////z/wD/z/AAAAAPz/n///9////////////z7+////////D/4E/A+APwAA//zh////////////////AOD///////858AP4BwAfAIB//////////////////38A+P//////fwDAAfADAAAA8J//////////////////fwD8//////8fAD4A4AMAAADwj///////////////f/YHAPA3+P///x8AfgAAAAAAAPAf8v////////////8/HAAAAAfA////PwD+BwAAAAAQMA/+////////////DwAOAACABQD+////Af4PAAAAADDAjv////////////8HgA8AABAAAPz///8H/h8AAAAAcECD/////////////wGABwAAAAAA+P///z///wAAAADOwPv/////////////C4ADAAAAAADw////P///AAAAAOb5//////////////8/gAEAAAAAAOD///////8AAAAA4P3//////////////y8AAAAAAAAA4P//////jQAAAAAA////////////////bwAAAAAAAACA/v/////DAwAAAOD///////////////8vAAAAAAAAAAD//////wMCAAAAwP///////////////ycAAAAAAAAAAP//////HwAAAACA//+f+cP/////////AwAAAAAAAAAA//////8GAAAAAID/+R/48/////////8hAAAAAAAAAID/////PwAAAAAA/APzD+Dj////////f3AAAAAAAAAAAP////8/AAAAAAD8A86P48f///////8PAAAAAAAAAAAA/////wcAAAAAAPxAyPn/x///////nwcYAAAAAAAAAAD/////BwAAAAAA/gCI+f/H//////8PBhgAAAAAAAAAAP7///8DAAAAAAB8QIb5/8///////38MDAAAAAAAAAAA/P///wMAAAAAAJD/AAD8////////PwwPAAAAAAAAAAD4////AQAAAAAA+P8AAP7///////8f5AMAAAAAAAAAAPD///8AAAAAAAD8/wEA/v///////z9wAAAAAAAAAAAA4P//PwAAAAAAAP7/xwf/////////fwAAAAAAAAAAAABA//8/AAAAAAAA/v////////////9/AAAAAAAAAAAAAED/D2AAAAAAAAD///////P//////38AAAAAAAAAAAAAgP4HYAAAAAAAgP/////+5///////PwAAAAAAAAAAAAAA/QdAAAAAAADA//////wP/v////8fAAAAAAAAAAAAAAD5BwAAAAAAAOD/////+Z8A/////08AAAAAAAAAAAAAAPAHAAAAAAAA8P/////5/wP+////JwAAAAAAAAAAAAAA4AeAAQAAAADw//////P/A/5//v8AAAAAAAAAAAAAAADgBwMGAAAAAPD/////8/8B8D/8TwAAAAAAAAAAAAAAAMCPA3AAAAAA8P/////n/wHwD/hnAAAAAAAAAAAAAAAAAP8BAAAAAADw/////8//APAH+A9AAAAAAAAAAAAAAAAA/AEAAAAAAPD/////zx8A8APoH2AAAAAAAAAAAAAAAADAHwAAAAAA8P/////fDwDgAeA/QAAAAAAAAAAAAAAAAAAfAAAAAADw/////78BAOABwD/AAAAAAAAAAAAAAAAAABwQAAAAAPD/////fwAA4AFAPgAAAAAAAAAAAAAAAAAAGPwFAAAA4P//////DwDAAUAcgAAAAAAAAAAAAAAAAACw/R8AAADA//////8PAMACQAAAAgAAAAAAAAAAAAAAAED/PwAAAID//////w8AAAJAAIADAAAAAAAAAAAAAAAAAP5/AAAAAP//////BwAAAoABCAEAAAAAAAAAAAAAAAAA/v8HAAAATvD///8DAAAAsAEeAAAAAAAAAAAAAAAAAAD+/w8AAAAAgP///wMAAABgAw4AAAAAAAAAAAAAAAAAAP//DwAAAACA////AQAAAMCDDwAAAAAAAAAAAAAAAACA//8PAAAAAID//38AAAAAwOFPAAAAAAAAAAAAAAAAAID//38AAAAAwP//PwAAAACAwy9gAAAAAAAAAAAAAAAAgP///wAAAACA//8fAAAAAADHZ8AGAAAAAAAAAAAAAACA////DwAAAID//w8AAAAAAAdmwD8AAAAAAAAAAAAAAMD///8/AAAAAP//DwAAAAAABKAA/gAAAAAAAAAAAAAAgP///38AAAAA/v8PAAAAAAAYAAD8BQAAAAAAAAAAAACA////fwAAAAD+/w8AAAAAAOABAPwBAAAAAAAAAAAAAAD///9/AAAAAP7/DwAAAAAAAAADMAMAAAAAAAAAAAAAAP///z8AAAAA/P8fAAAAAAAAAAAAAAAAAAAAAAAAAAAA/v//HwAAAAD8/x8AAAAAAAAAwCAAAAAAAAAAAAAAAAD8//8fAAAAAP7/HwwAAAAAAADwIQAAAAAAAAAAAAAAAPz//w8AAAAA/v8fDAAAAAAAAP5hAAAAAAAAAAAAAAAA+P//DwAAAAD//w8PAAAAAAAA//MAAAAAAAAAAAAAAADg//8PAAAAAP//hwcAAAAAAID//wAAQAAAAAAAAAAAAMD//w8AAAAA/v+DBwAAAAAAwP//AAAAAAAAAAAAAAAAwP//BwAAAAD+/4EHAAAAAADw//8DAAAAAAAAAAAAAADA//8HAAAAAPz/gQMAAAAAAPz//wMAAAAAAAAAAAAAAMD//wEAAAAA/P+BAwAAAAAA/v//BwAAAAAAAAAAAAAAwP9/AAAAAAD8/4EDAAAAAAD+//8PAAAAAAAAAAAAAADA/z8AAAAAAPh/AAAAAAAAAP7//x8AAAAAAAAAAAAAAMD/PwAAAAAA+H8AAAAAAAAA/v//HwAAAAAAAAAAAAAA4P8fAAAAAADwfwAAAAAAAAD+//8fAAAAAAAAAAAAAADg/w8AAAAAAPA/AAAAAAAAAPz//x8AAAAAAAAAAAAAAOD/BwAAAAAA4B8AAAAAAAAA/P//HwAAAAAAAAAAAAAA4P8HAAAAAADgDwAAAAAAAAD8Af8PAAAAAAAAAAAAAADg/wMAAAAAAGAAAAAAAAAAABwA/QcAAAAAAAAAAAAAAPB/AAAAAAAAAAAAAAAAAAAAAAD4BwAIAAAAAAAAAAAA8H8AAAAAAAAAAAAAAAAAAAAAAPAHABAAAAAAAAAAAADwPwAAAAAAAAAAAAAAAAAAAAAAgAAAcAAAAAAAAAAAAPAPAAAAAAAAAAAAAAAAAAAAAAAAAAAwAAAAAAAAAAAA+AMAAAAAAAAAAAAAAAAAAAAAAIADAAwAAAAAAAAAAADwAwAAAAAAAAAAAAAAAAAAAAAAgAEABgAAAAAAAAAAAPgDAAAAAAAAAAAAAAAAAAAAAAAAAIADAAAAAAAAAAAA+AAAAAAAAAAAAAAAAAAAAAAAAAAAgAEAAAAAAAAAAAD4AQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAPwBAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA/AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAB4IAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAHgAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA8AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAACAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAMAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAMAAAAAAAAAAADwAQBAgO/H/3sAAAAAAAAAAAAAAAAAAwAAAAAAAAAAgP//Af///////wMAAAAAAAAAAAAAAOAHAAAAAAAAAMD////B/////////wEAAAAAAAAAAAAA8A8AAAAACP7///////n//////////wAAAAAAAACAAwAgHwAAAID/////////////////////AQAAAAAAAID///8fAAAA4P////////////////////8AAAAA/f///////wMAAAD4////////////////////HwAAAID///////8/AAAA+P////////////////////8PAAAA/////////wcA4ID//////////////////////x8AACDA////////AQDwgfn/////////////////////BwAAAMD///////8/FDyA//////////////////////8DAAAA+P////////8f/v///////////////////////w8AAAD4/////////////////////////////////////wH/Hwb//////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////w==";
const raw=atob(B64),MASK=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)MASK[i]=raw.charCodeAt(i);
const MW=256,MH=128;
const land=(lat,lon)=>{let x=Math.floor((lon+180)/360*MW),y=Math.floor((90-lat)/180*MH);x=(x%MW+MW)%MW;y=y<0?0:y>=MH?MH-1:y;const i=y*MW+x;return (MASK[i>>3]>>(i&7))&1};

const D=Math.PI/180;
/* warehouses and customers, [lat, lon] */
const HUBS=[[37.8,-122.4],[34,-118.2],[43.7,-79.4],[40.7,-74],[25.8,-80.2],[19.4,-99.1],[-23.5,-46.6],[-34.6,-58.4],[51.5,-0.1],[51.9,4.5],[52.5,13.4],[6.5,3.4],[-26.2,28],[25.2,55.3],[19.1,72.9],[1.35,103.8],[31.2,121.5],[35.7,139.7],[-33.9,151.2],[41.9,-87.6],[29.8,-95.4],[47.6,-122.3],[48.9,2.4],[28.6,77.2],[-1.3,36.8],[37.6,127],[4.7,-74.1],[-12,-77]];
const vec=(lat,lon)=>{lat*=D;lon*=D;return [Math.cos(lat)*Math.sin(lon),Math.sin(lat),Math.cos(lat)*Math.cos(lon)]};
const HV=HUBS.map(h=>vec(h[0],h[1]));

const cv=document.getElementById('c'),g=cv.getContext('2d');
const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
let W=0,H=0,dpr=1,cx=0,cy=0,R=0,S=9;
let lon0=-52,pitch=24,roll=-20,drag=null;
const SPEED=7;               /* degrees of longitude per second */
const view={};
const setView=()=>{const a=lon0*D,p=pitch*D,r=roll*D;view.ca=Math.cos(a);view.sa=Math.sin(a);view.cp=Math.cos(p);view.sp=Math.sin(p);view.cr=Math.cos(r);view.sr=Math.sin(r)};
/* world unit vector -> view space (x right, y up, z toward the viewer) */
const toView=(v,k,out)=>{
  const x1=v[0]*view.ca-v[2]*view.sa,z1=v[0]*view.sa+v[2]*view.ca;
  const y2=v[1]*view.cp-z1*view.sp,z2=v[1]*view.sp+z1*view.cp;
  out[0]=(x1*view.cr-y2*view.sr)*k;out[1]=(x1*view.sr+y2*view.cr)*k;out[2]=z2*k;return out;
};

function resize(){
  const r=cv.parentNode.getBoundingClientRect();
  dpr=Math.min(2,window.devicePixelRatio||1);
  W=Math.round(r.width);H=Math.round(r.height);
  cv.width=W*dpr;cv.height=H*dpr;
  if(W<760){R=Math.min(W*.5,H*.3);cx=W*.5;cy=H*.72}
  else{R=Math.min(H*.44,W*.3);cx=W*.745;cy=H*.52}
  S=Math.max(5,Math.round(R/56));
  if(reduce)frame(0);
}
addEventListener('resize',resize);

/* ---------- orders ---------- */
const orders=[],bursts=[];
const rnd=(a,b)=>a+Math.random()*(b-a);
const tmp=[0,0,0];
function facing(v){toView(v,1,tmp);return tmp[2]>-.15}
function spawn(){
  for(let tries=0;tries<12;tries++){
    const a=(Math.random()*HV.length)|0,b=(Math.random()*HV.length)|0;
    if(a===b)continue;
    const A=HV[a],Bv=HV[b];
    if(!(facing(A)||facing(Bv)))continue;
    const dot=Math.max(-1,Math.min(1,A[0]*Bv[0]+A[1]*Bv[1]+A[2]*Bv[2])),om=Math.acos(dot);
    if(om<.28)continue;
    orders.push({A,B:Bv,om,sn:Math.sin(om),age:0,dur:rnd(2.4,4.2)*(.6+om/Math.PI*.7),alt:.05+.3*Math.pow(om/Math.PI,1.1),arr:false});
    bursts.push({v:A,t:0,max:.35,r:.05});
    return;
  }
}
let acc=0;
function step(dt){
  acc-=dt;
  while(acc<=0){spawn();acc+=rnd(.16,.38)}
  for(let i=orders.length-1;i>=0;i--){
    const o=orders[i];o.age+=dt;const u=o.age/o.dur;
    if(u>=1&&!o.arr){o.arr=true;bursts.push({v:o.B,t:0,max:.9,r:.16})}
    if(u>=1.4)orders.splice(i,1);
  }
  for(let i=bursts.length-1;i>=0;i--){bursts[i].t+=dt;if(bursts[i].t>=bursts[i].max)bursts.splice(i,1)}
}
const pt=(o,u,out)=>{
  const s=Math.sin(o.om*(1-u))/o.sn,e=Math.sin(o.om*u)/o.sn,k=1+o.alt*Math.sin(Math.PI*u);
  out[0]=(o.A[0]*s+o.B[0]*e)*k;out[1]=(o.A[1]*s+o.B[1]*e)*k;out[2]=(o.A[2]*s+o.B[2]*e)*k;return out;
};
const vis=(p)=>p[2]>0||p[0]*p[0]+p[1]*p[1]>1;
const P=[0,0,0],Q=[0,0,0],W3=[0,0,0];
const sx=(p)=>cx+p[0]*R, sy=(p)=>cy-p[1]*R;

/* ---------- drawing ---------- */
function drawGlobe(){
  const cr=view.cr,sr=view.sr,ca=view.ca,sa=view.sa,cp=view.cp,sp=view.sp;
  const half=Math.ceil(R/S)+1,d=Math.max(2,Math.round(S*.4));
  for(let j=-half;j<=half;j++){
    const y3=-(j*S)/R;
    for(let i=-half;i<=half;i++){
      const x3=(i*S)/R,r2=x3*x3+y3*y3;
      if(r2>=1)continue;
      const z3=Math.sqrt(1-r2);
      const x1=x3*cr+y3*sr,y2=-x3*sr+y3*cr;
      const y=y2*cp+z3*sp,z1=-y2*sp+z3*cp;
      const x=x1*ca+z1*sa,z=-x1*sa+z1*ca;
      const lat=Math.asin(y)/D,lon=Math.atan2(x,z)/D;
      const px=Math.round(cx+i*S-d/2),py=Math.round(cy+j*S-d/2);
      if(land(lat,lon)){
        g.globalAlpha=.3+.7*Math.pow(z3,.45);
        g.fillRect(px,py,d,d);
      }else{
        g.globalAlpha=.1;
        g.fillRect(px+Math.floor(d/2)-.0,py+Math.floor(d/2),1,1);
      }
    }
  }
}
function drawOrders(){
  g.lineCap='round';
  for(const o of orders){
    const uh=o.age/o.dur,head=Math.min(uh,1),tail=Math.max(0,uh-.42);
    /* faint full route */
    g.strokeStyle='#fff';g.globalAlpha=.1*(1-Math.max(0,uh-1)/.4);g.lineWidth=1;
    g.beginPath();let pen=false;
    for(let k=0;k<=28;k++){pt(o,k/28,P);toView(P,1,W3);if(vis(W3)){pen?g.lineTo(sx(W3),sy(W3)):g.moveTo(sx(W3),sy(W3));pen=true}else pen=false}
    g.stroke();
    /* bright trail */
    const N=22;let prev=null;
    for(let k=0;k<=N;k++){
      const u=tail+(head-tail)*k/N;pt(o,u,P);toView(P,1,Q);
      const ok=vis(Q);
      if(prev&&ok){g.globalAlpha=Math.pow(k/N,1.6)*.95;g.lineWidth=1+1.2*k/N;g.beginPath();g.moveTo(sx(prev),sy(prev));g.lineTo(sx(Q),sy(Q));g.stroke()}
      prev=ok?[Q[0],Q[1],Q[2]]:null;
    }
    /* the order itself: a small square box */
    if(uh<1){pt(o,head,P);toView(P,1,Q);if(vis(Q)){g.globalAlpha=1;const s=Math.max(3,Math.round(S*.45));g.fillRect(Math.round(sx(Q)-s/2),Math.round(sy(Q)-s/2),s,s)}}
  }
  /* pixel rings where orders leave and land */
  for(const b of bursts){
    const t=b.t/b.max,rad=b.r*t,A=b.v;
    let t1=[A[1]*0-A[2]*1+0,0,0];
    /* tangent basis */
    const up=Math.abs(A[1])>.95?[1,0,0]:[0,1,0];
    t1=[up[1]*A[2]-up[2]*A[1],up[2]*A[0]-up[0]*A[2],up[0]*A[1]-up[1]*A[0]];
    const l=Math.hypot(t1[0],t1[1],t1[2]);t1=[t1[0]/l,t1[1]/l,t1[2]/l];
    const t2=[A[1]*t1[2]-A[2]*t1[1],A[2]*t1[0]-A[0]*t1[2],A[0]*t1[1]-A[1]*t1[0]];
    g.globalAlpha=(1-t)*.9;
    for(let k=0;k<10;k++){
      const an=k/10*Math.PI*2,c=Math.cos(an)*rad,s=Math.sin(an)*rad;
      const p=[A[0]+t1[0]*c+t2[0]*s,A[1]+t1[1]*c+t2[1]*s,A[2]+t1[2]*c+t2[2]*s];
      const m=Math.hypot(p[0],p[1],p[2]);p[0]/=m;p[1]/=m;p[2]/=m;
      toView(p,1,Q);if(Q[2]>0){const z=Math.max(2,Math.round(S*.3));g.fillRect(Math.round(sx(Q)-z/2),Math.round(sy(Q)-z/2),z,z)}
    }
  }
}
function frame(dt){
  if(!drag)lon0-=SPEED*dt;
  setView();
  g.setTransform(dpr,0,0,dpr,0,0);
  g.fillStyle='#000';g.globalAlpha=1;g.fillRect(0,0,W,H);
  g.fillStyle='#fff';
  drawGlobe();
  drawOrders();
  g.globalAlpha=1;
}

/* ---------- drag to turn the globe ---------- */
cv.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY};cv.classList.add('drag');cv.setPointerCapture(e.pointerId)});
cv.addEventListener('pointermove',e=>{if(!drag)return;lon0-=(e.clientX-drag.x)*.3;pitch=Math.max(-15,Math.min(60,pitch+(e.clientY-drag.y)*.2));drag.x=e.clientX;drag.y=e.clientY;if(reduce){setView();frame(0)}});
const up=()=>{drag=null;cv.classList.remove('drag')};
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);



/* ---------- ILG logo: three extruded square letters that build an isometric cube; the lit right-hand walls are the white "shadow" ---------- */
const LN=5,GAP=.2,G2=GAP/2;
const LETTERS={
  I:["#####","..#..","..#..","..#..","#####"],
  L:["#....","#....","#....","#....","#####"],
  G:["#####","#....","#.###","#...#","#####"]
};
const VOX=new Set(),vk=(x,y,z)=>x+','+y+','+z,has=(x,y,z)=>VOX.has(vk(x,y,z));
for(let j=0;j<LN;j++)for(let i=0;i<LN;i++){
  if(LETTERS.I[j][i]==='#')VOX.add(vk(i,LN-1-j,LN-1));       /* I on the left face (+z) */
  if(LETTERS.L[j][i]==='#')VOX.add(vk(LN-1,LN-1-j,LN-1-i));  /* L on the right face (+x) */
  if(LETTERS.G[j][i]==='#')VOX.add(vk(i,LN-1,j));            /* G on the top (+y) */
}
function drawLogo(){
  const L=document.getElementById('logo'),r=L.getBoundingClientRect(),dp=Math.min(3,(window.devicePixelRatio||1)*1.5);
  L.width=Math.round(r.width*dp);L.height=Math.round(r.height*dp);
  const c=L.getContext('2d');c.setTransform(dp,0,0,dp,0,0);
  const ph=Math.atan(1/Math.SQRT2),cp=Math.cos(ph),sp=Math.sin(ph),q=Math.SQRT1_2;
  const k=Math.min((r.width-3)/(LN*Math.SQRT2),(r.height-3)/(LN*(cp+Math.SQRT2*sp)));
  /* screen position of a cube-space point (x toward the right-back, y up, z toward the left-front) */
  const P=(x,y,z)=>{const xr=(x-z)*q,zr=(x+z)*q;return [r.width/2+xr*k,r.height/2-(y*cp-zr*sp)*k]};
  const lw=Math.max(1,r.width*.008);
  c.lineJoin='miter';
  const poly=(pts,fill)=>{c.beginPath();pts.forEach((p,n)=>n?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1]));c.closePath();c.fillStyle=fill;c.fill();c.strokeStyle=fill;c.lineWidth=.8;c.stroke()};
  const seg=(a,b)=>{c.beginPath();c.moveTo(a[0],a[1]);c.lineTo(b[0],b[1]);c.strokeStyle='rgba(255,255,255,.88)';c.lineWidth=lw;c.stroke()};
  const topOk=(x,y,z)=>has(x,y,z)&&!has(x,y+1,z),leftOk=(x,y,z)=>has(x,y,z)&&!has(x,y,z+1),rightOk=(x,y,z)=>has(x,y,z)&&!has(x+1,y,z);
  /* faint pixel world on the black faces */
  const SH=-75,W=4;
  const dots=(face,x,y,z)=>{
    for(let b=0;b<W;b++)for(let a=0;a<W;a++){
      const u=(a+.5)/W,v=(b+.5)/W;let X,Y,Z,cr;
      if(face==='top'){X=x+u;Y=y+1;Z=z+v;cr=[[x+(a+.15)/W,y+1,z+(b+.15)/W],[x+(a+.85)/W,y+1,z+(b+.15)/W],[x+(a+.85)/W,y+1,z+(b+.85)/W],[x+(a+.15)/W,y+1,z+(b+.85)/W]]}
      else{X=x+u;Y=y+1-v;Z=z+1;cr=[[x+(a+.15)/W,y+1-(b+.15)/W,z+1],[x+(a+.85)/W,y+1-(b+.15)/W,z+1],[x+(a+.85)/W,y+1-(b+.85)/W,z+1],[x+(a+.15)/W,y+1-(b+.85)/W,z+1]]}
      /* world position relative to the cube centre */
      const cx=X/LN*2-1,cy=Y/LN*2-1,cz=Z/LN*2-1,m=Math.hypot(cx,cy,cz);
      if(land(Math.asin(cy/m)/D,Math.atan2(cx,cz)/D+SH))poly(cr.map(p=>P(p[0],p[1],p[2])),'rgba(255,255,255,.3)');
    }
  };
  for(let x=0;x<LN;x++)for(let y=0;y<LN;y++)for(let z=0;z<LN;z++){
    if(!has(x,y,z))continue;
    if(topOk(x,y,z)){
      const a=x,b=x+1-(x===LN-1?G2:0),e=z,f=z+1-(z===LN-1?G2:0);   /* G meets L at x=4 and I at z=4 */
      poly([P(a,y+1,e),P(b,y+1,e),P(b,y+1,f),P(a,y+1,f)],'#000');dots('top',x,y,z);
      if(!topOk(x-1,y,z))seg(P(a,y+1,e),P(a,y+1,f));
      if(!topOk(x+1,y,z))seg(P(b,y+1,e),P(b,y+1,f));
      if(!topOk(x,y,z-1))seg(P(a,y+1,e),P(b,y+1,e));
      if(!topOk(x,y,z+1))seg(P(a,y+1,f),P(b,y+1,f));
    }
    if(leftOk(x,y,z)){
      const a=x,b=x+1-(x===LN-1?G2:0),e=y,f=y+1-(y===LN-1?G2:0);   /* I meets L at x=4 and G at y=4 */
      poly([P(a,e,z+1),P(b,e,z+1),P(b,f,z+1),P(a,f,z+1)],'#000');dots('left',x,y,z);
      if(!leftOk(x-1,y,z))seg(P(a,e,z+1),P(a,f,z+1));
      if(!leftOk(x+1,y,z))seg(P(b,e,z+1),P(b,f,z+1));
      if(!leftOk(x,y-1,z))seg(P(a,e,z+1),P(b,e,z+1));
      if(!leftOk(x,y+1,z))seg(P(a,f,z+1),P(b,f,z+1));
    }
    if(rightOk(x,y,z)){
      const a=z,b=z+1-(z===LN-1?G2:0),e=y,f=y+1-(y===LN-1?G2:0);   /* L meets I at z=4 and G at y=4 */
      poly([P(x+1,e,a),P(x+1,e,b),P(x+1,f,b),P(x+1,f,a)],'#fff');
      if(!rightOk(x,y,z-1))seg(P(x+1,e,a),P(x+1,f,a));
      if(!rightOk(x,y,z+1))seg(P(x+1,e,b),P(x+1,f,b));
      if(!rightOk(x,y-1,z))seg(P(x+1,e,a),P(x+1,e,b));
      if(!rightOk(x,y+1,z))seg(P(x+1,f,a),P(x+1,f,b));
    }
  }
}

resize();setView();drawLogo();addEventListener("resize",drawLogo);
for(let i=0;i<150;i++){step(1/30);lon0-=SPEED/30}        /* start with orders already in flight */
if(reduce){frame(0)}
else{let last=performance.now();const loop=(t)=>{const dt=Math.min(.05,(t-last)/1000);last=t;step(dt);frame(dt);requestAnimationFrame(loop)};requestAnimationFrame(loop)}
})();
</script>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Asterisk</title>
<style>
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:#000;overflow:hidden}
body{display:flex;flex-direction:column}
nav.back{box-sizing:border-box;flex:none;display:flex;align-items:center;gap:8px;height:49px;padding:0 20px;background:#000;border-bottom:1px solid #1c1c1c;font:400 13px/1.35 "Inter","Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;white-space:nowrap}
nav.back a{color:#8d8d8d;text-decoration:none}
nav.back a:hover,nav.back a:focus-visible{color:#fff;text-decoration:underline;text-underline-offset:3px}
nav.back span{color:#6e6e6e}
nav.back b{font-weight:500;color:#fff;overflow:hidden;text-overflow:ellipsis}
@media (max-width:640px){nav.back{padding:0 16px}nav.back>span:nth-of-type(2),nav.back>b{display:none}}
main{flex:1;min-height:0;position:relative}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
</style>
</head>
<body>
<nav class="back" aria-label="Sandbox"><a href="../">Sandbox</a><span>/</span><a href="../">Back to all projects</a><span>/</span><b>Asterisk</b></nav>
<main><canvas id="c" role="img" aria-label="A pixel asterisk with six arms. Hover an arm and it breaks into particles."></canvas></main>
<script>
(() => {
  const cv = document.getElementById('c'), ctx = cv.getContext('2d');
  const COLOR = '#5cffae';
  const U = 512, G = 80, CELL = U / G;          // symbol units, grid of 80x80 cells
  const HALF = 176, W = 24, HUB = 34;           // arm length, arm width, hub radius (units)
  const ANGLES = [-90, -30, 30, 90, 150, 210].map(a => a * Math.PI / 180);
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

  // Sample every arm onto the pixel grid
  const cells = [];
  for (let gy = 0; gy < G; gy++) for (let gx = 0; gx < G; gx++) {
    const x = (gx + .5) * CELL - U / 2, y = (gy + .5) * CELL - U / 2;
    let arm = -1, best = 1e9;
    ANGLES.forEach((a, i) => {
      const c = Math.cos(a), s = Math.sin(a), t = x * c + y * s, d = Math.abs(-x * s + y * c);
      if (t >= -W / 2 && t <= HALF && d <= W / 2 && d < best) { best = d; arm = i; }
    });
    if (arm < 0) continue;
    const a = ANGLES[arm], t = x * Math.cos(a) + y * Math.sin(a);
    const dist = Math.hypot(x, y);
    cells.push({ x, y, arm: dist < HUB ? -1 : arm, o: Math.min(1, Math.max(0, dist / HALF)),
      r1: rnd(), r2: rnd(), r3: rnd(), a, t });
  }

  const prog = new Array(6).fill(0), target = new Array(6).fill(0);
  let W_, H_, S, ox, oy, dpr, mouse = null;

  function resize() {
    dpr = Math.min(2, devicePixelRatio || 1);
    const r = cv.getBoundingClientRect();
    W_ = r.width; H_ = r.height;
    cv.width = Math.round(W_ * dpr); cv.height = Math.round(H_ * dpr);
    S = Math.min(W_, H_) * .8 / U;
    S = Math.max(1, Math.floor(S * CELL * dpr)) / (CELL * dpr); // whole device pixels per cell
    ox = Math.round(W_ * dpr / 2) / dpr; oy = Math.round(H_ * dpr / 2) / dpr;
  }
  addEventListener('resize', resize); resize();

  function pick(px, py) {
    const x = (px - ox) / S, y = (py - oy) / S;
    let arm = -1, best = 1e9;
    ANGLES.forEach((a, i) => {
      const c = Math.cos(a), s = Math.sin(a), t = x * c + y * s, d = Math.abs(-x * s + y * c);
      if (t > HUB * .6 && t < HALF + 40 && d < W * 1.1 && d < best) { best = d; arm = i; }
    });
    return arm;
  }
  function hover(e) {
    const r = cv.getBoundingClientRect();
    const arm = pick(e.clientX - r.left, e.clientY - r.top);
    target.fill(0); if (arm >= 0) target[arm] = 1;
    cv.style.cursor = arm >= 0 ? 'pointer' : 'default';
  }
  cv.addEventListener('pointermove', hover);
  cv.addEventListener('pointerdown', hover);
  cv.addEventListener('pointerleave', () => target.fill(0));
  cv.addEventListener('pointerup', e => { if (e.pointerType !== 'mouse') target.fill(0); });
  cv.addEventListener('pointercancel', () => target.fill(0));

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(.05, (now - last) / 1000); last = now;
    for (let i = 0; i < 6; i++) {
      const k = target[i] ? 1.5 : 1.2;
      prog[i] += Math.sign(target[i] - prog[i]) * Math.min(Math.abs(target[i] - prog[i]), dt * k);
    }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W_, H_);
    ctx.fillStyle = COLOR;
    const px = CELL * S, T = now / 1000;
    for (const c of cells) {
      const p = c.arm < 0 ? 0 : prog[c.arm];
      let x = c.x, y = c.y, size = 1, alpha = 1;
      if (p > 0) {
        // outer cells let go first, inner cells last
        const th = (1 - c.o) * .62 + c.r1 * .3;
        const u = Math.min(1, Math.max(0, (p - th) / .38));
        if (u > 0) {
          const e = u * u * (3 - 2 * u);
          const ang = c.a + (c.r2 - .5) * 1.6;
          const spd = 18 + c.r3 * 100;
          x += Math.cos(ang) * spd * e * .9 + Math.sin(T * 1.7 + c.r1 * 40) * 6 * e;
          y += Math.sin(ang) * spd * e * .9 - (14 + c.r2 * 60) * e + Math.cos(T * 1.3 + c.r3 * 40) * 6 * e;
          size = 1 - e * (.45 + c.r3 * .2);
          alpha = 1 - e * (.15 + c.r1 * .45);
        }
      }
      const s = size === 1 ? px : Math.max(1 / dpr, Math.round(px * size * dpr) / dpr);
      const mx = Math.round((x - c.x) * S / px) * px, my = Math.round((y - c.y) * S / px) * px;
      const gx = ox + c.x * S - px / 2 + mx + (px - s) / 2;
      const gy = oy + c.y * S - px / 2 + my + (px - s) / 2;
      ctx.globalAlpha = alpha;
      ctx.fillRect(Math.round(gx * dpr) / dpr, Math.round(gy * dpr) / dpr, s, s);
    }
    ctx.globalAlpha = 1;
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stop Building Demos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>

/* ---------- Back nav (shared across all apps) ---------- */
nav.back{box-sizing:border-box;flex:none;display:flex;align-items:center;gap:8px;height:49px;padding:0 20px;background:#000;border-bottom:1px solid #1c1c1c;font:400 13px/1.35 "Inter","Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;white-space:nowrap;overflow:hidden}
nav.back a{color:#8d8d8d;text-decoration:none}
nav.back a:hover,nav.back a:focus-visible{color:#fff;text-decoration:underline;text-underline-offset:3px}

@media (max-width:640px){nav.back{padding:0 16px}}
</style>
</head>
<body>
<nav class="back" aria-label="Apps"><a href="../">Apps</a><span>/</span><a href="../">Back to all projects</a><span>/</span><b>Stop Building Demos</b></nav>
<main id="stage"></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
<script>
/* ---- palette (demo UI + prompt box from the supplied code) ---- */
const NAVY = "#0f0f42", CREAM = "#fcfcf9", PALE = "#e9e5d8", FRAME = "#ece9df";
const HL = "#0f0f42", GREEN = "#5f9f66", UI_LINE = "#e6e4dc", SKY = "#b9b3a3";
const LIGHT = "#efece5";            // scene 1 background (from the swatch)
const DEEP = "#0e0e43";             // scene 2 background (from the image)
const SANS = "Arial", MONO = "Courier New", SERIF = "Georgia";
const HEAD = "'Inter Tight','Helvetica Neue',Helvetica,Arial,sans-serif";

const L1 = "Fill these charts", L2 = "with demo data.";
const N1 = L1.length, TOT = N1 + 1 + L2.length;
const NAMES_A = ["Northwind", "Globex", "Initech"], NAMES_B = ["AbbVie", "AstraZeneca", "Bristol Myers"];
const NAV_W = [70, 44, 62, 52, 38], ROW_Y = [274, 332, 390];
const ROW_U = [[[228,150,0],[408,104,1],[588,70,1]],[[228,112,0],[408,126,1],[588,60,1]],[[228,168,0],[408,88,1],[588,76,1]]];
const LINK_SVG = "M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1";
const SPARK_SVG = "M23.5422 0L25.0998 14.1444C25.1837 14.9055 26.0747 15.2744 26.6721 14.7954L37.7748 5.89529L39.1892 7.30951L30.2889 18.4124C29.81 19.0098 30.1789 19.9007 30.9401 19.9845L30.9395 19.9849L45.0838 21.5421V23.5422L25.6785 25.6788L23.5419 45.084H21.5418L19.9845 30.9398C19.9007 30.1786 19.0098 29.8097 18.4124 30.2887L7.30951 39.1889L5.89529 37.7745L14.7954 26.6718C15.2744 26.0744 14.9055 25.1834 14.1444 25.0995L0 23.5422V21.5421L19.4055 19.4053L21.5421 0H23.5422ZM24.9703 19.5719C23.3515 19.4237 21.7324 19.4237 20.1136 19.5719C19.8427 19.5975 19.5975 19.8427 19.5719 20.1136C19.4237 21.7324 19.4237 23.3515 19.5719 24.9703C19.5974 25.2412 19.8427 25.4866 20.1136 25.5122C21.7324 25.6601 23.3515 25.6601 24.9703 25.5122C25.2412 25.4866 25.4866 25.2412 25.5122 24.9703C25.6604 23.3515 25.6604 21.7324 25.5122 20.1136C25.4866 19.8427 25.2412 19.5974 24.9703 19.5719Z";

/* ---- stage: 1920x1112, same as the reference image ---- */
const SW_ = 1920, SH_ = 1112;
const CX = 1440, CY = 556;           // centre: logo, rays, lens
const BANDS = [[156, 246], [284, 448], [488, 770]];   // ray bands (radius), measured
const NRAYS = 48;
const WINS = .95;                    // UI window scale, centred on the rays
const WIN = { x: CX - 450 * WINS, y: CY - 282.5 * WINS, s: WINS };              // sales demo window (613x461 at scale s)
const WIN_R = 1150;                  // iris radius that fully covers the window

/* ---- timeline (seconds). Scene 1 (light) = prompt, scene 2 (navy) = UI being filled ---- */
const T_SPIN = 1.0, SPIN_D = 1.7;    // scene 1: logo spins, rays draw out
const T_BOX = 2.0, TYPE0 = T_BOX + .9;   // prompt box appears, then types
const LENS_D = 1.3, CLOSE_D = 1.6, HOP = .85;
let RT = [0, 0], TYPE_DUR = 0, T_S, T_OUT, T_B, T_C, T_WORDS, T_S2, T_TOUR, T_A, T_BACK, LOOP;
let tA0, tA1, tB0, tB1, tC0, tC1;       // logo sweeps: KPI tiles, chart, table
const OFF = .9;                      // later loops skip the headline intro

let ti = 0, START = 0.5, PS = 1, ready = false;
let SPARK_P, LINK_P, grain;
const EASE = bez(.25, .1, .25, 1), EMOVE = bez(.45, 0, .2, 1), EOUT = bez(.2, .8, .2, 1), EIO = bez(.65, 0, .35, 1);

function bez(x1, y1, x2, y2) {
  const f = (a, b, t) => 3*a*t*(1-t)*(1-t) + 3*b*t*t*(1-t) + t*t*t;
  return x => { if (x <= 0) return 0; if (x >= 1) return 1; let lo = 0, hi = 1;
    for (let i = 0; i < 24; i++) { const m = (lo + hi) / 2; if (f(x1, x2, m) < x) lo = m; else hi = m; }
    return f(y1, y2, (lo + hi) / 2); };
}
const pr = (t, t0, d) => constrain((t - t0) / d, 0, 1);
function ls(px) { try { drawingContext.letterSpacing = px + "px"; } catch (e) {} }
function ca(hex, a) { const c = color(hex); c.setAlpha(255 * a); return c; }
function tx(s, x, y, size, col, fam, spc, h) {
  noStroke(); fill(col); textFont(fam || SANS); textSize(size); textStyle(NORMAL);
  textAlign(h || LEFT, CENTER); ls(spc || 0); text(s, x, y); ls(0);
}
function tw(s, size, fam, spc) { textFont(fam || SANS); textSize(size); textStyle(NORMAL); ls(spc || 0); const w = textWidth(s); ls(0); return w; }

/* headline text drawn straight on the 2d context (needs weights 300 / 600) */
const HS = 106, HSP = -3.0;
function hw(s, wt) { const c = drawingContext; c.save(); c.font = wt + " " + HS + "px " + HEAD; c.letterSpacing = HSP + "px"; const w = c.measureText(s).width; c.restore(); return w; }
function ht(s, x, y, wt, col, a) {
  const c = drawingContext; c.save(); c.globalAlpha *= a; c.fillStyle = col;
  c.font = wt + " " + HS + "px " + HEAD; c.letterSpacing = HSP + "px"; c.textBaseline = "alphabetic"; c.fillText(s, x, y); c.restore();
}
const BASE = [485, 597, 710];       // baselines from the reference
const HX = 107;

/* the Reprise spark (exact path), centred on (x,y) */
function spark(x, y, sc, rot, col, a) {
  if (a <= 0) return;
  const c = drawingContext; c.save(); c.globalAlpha *= a; c.translate(x, y); c.rotate(rot); c.scale(sc, sc);
  c.translate(-22.54, -22.54); c.fillStyle = col; c.fill(SPARK_P, "evenodd"); c.restore();
}
function circClip(r) { const c = drawingContext; c.beginPath(); c.arc(CX, CY, max(r, 0.01), 0, TWO_PI); c.clip(); }

function setup() {
  const host = document.getElementById("stage"); createCanvas(host.clientWidth, host.clientHeight).parent(host);
  frameRate(60);
  SPARK_P = new Path2D(SPARK_SVG); LINK_P = new Path2D(LINK_SVG);
  makeGrain();
  for (let n = 1; n <= TOT; n++) {
    const d = n === N1 + 1 ? .26 : .046 + .03 * (abs(sin(n * 12.9898) * 43758.5453) % 1);
    if (n < TOT) RT[n + 1] = RT[n] + d; else TYPE_DUR = RT[n] + d;
  }
  T_S = TYPE0 + TYPE_DUR + .7;      // send -> box turns navy
  T_OUT = T_S + 1.7;                // prompt fades, logo returns to centre
  T_B = T_OUT + 1.0;                // light lens closes onto the logo, navy opens
  T_C = T_B + LENS_D;
  T_WORDS = T_B + .9;               // "and start prompting them." arrives
  T_S2 = T_C + .1;                  // scene 2: logo spins, UI iris opens
  T_TOUR = T_S2 + 1.9;              // logo visits 5 blocks, filling each with data
  tA0 = T_TOUR; tA1 = tA0 + 1.1;     // sweep across the KPI tiles
  tB0 = tA1 + .5; tB1 = tB0 + 1.5;   // follow the chart line
  tC0 = tB1 + .5; tC1 = tC0 + 1.2;   // sweep down the table
  T_A = tC1 + 1.3;                  // logo back to centre, iris closes
  T_BACK = T_A + CLOSE_D;           // lens opens back to light
  LOOP = T_BACK + LENS_D + .5;
  document.fonts.load("400 112px 'Inter Tight'").then(() => document.fonts.load("600 112px 'Inter Tight'")).catch(() => {}).finally(() => { ready = true; });
}
function windowResized() { const h = document.getElementById("stage"); resizeCanvas(h.clientWidth, h.clientHeight); }

function makeGrain() {
  grain = document.createElement("canvas"); grain.width = SW_; grain.height = SH_;
  const g = grain.getContext("2d"); let s = 7;
  const r = () => (s = (s * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < 5200; i++) {
    const a = .08 + r() * .3;
    g.fillStyle = `rgba(${150 + r() * 60 | 0},${160 + r() * 60 | 0},255,${a})`;
    g.fillRect(r() * SW_, r() * SH_, r() > .85 ? 2 : 1, r() > .85 ? 2 : 1);
  }
}

function draw() {
  if (!ready) { background(LIGHT); return; }
  const tt = millis() / 1000 - START;
  if (tt < 0) ti = 0; else if (tt < LOOP) ti = tt; else ti = OFF + ((tt - LOOP) % (LOOP - OFF));
  PS = min(width / SW_, height / SH_);
  background(0);
  push();
  translate(width / 2, height / 2); scale(PS); translate(-SW_ / 2, -SH_ / 2);
  drawingContext.beginPath(); drawingContext.rect(0, 0, SW_, SH_); drawingContext.clip();

  if (ti < T_B) drawScene1(false);
  else if (ti < T_C) {
    drawScene2();
    push(); drawingContext.save(); circClip(2300 * (1 - EIO(pr(ti, T_B, LENS_D)))); drawScene1(false); drawingContext.restore(); pop();
  } else if (ti < T_BACK) drawScene2();
  else {
    drawScene1(true);
    push(); drawingContext.save(); circClip(2300 * (1 - EIO(pr(ti, T_BACK, LENS_D)))); drawScene2(); drawingContext.restore(); pop();
  }
  pop();
}

/* ============== SCENE 1 (light): prompt ============== */
function drawScene1(base) {
  noStroke(); fill(LIGHT); rect(0, 0, SW_, SH_);
  const a = base ? 1 : EASE(pr(ti, .1, .8)), up = base ? 0 : 26 * (1 - EOUT(pr(ti, .1, 1)));
  push(); drawingContext.globalAlpha = a;
  ht("Stop building", HX, BASE[0] + up, 400, NAVY, 1);
  ht("demos", HX, BASE[1] + up, 400, NAVY, 1);
  pop();
  if (base) { spark(CX, CY, 2.6, 0, NAVY, 1); return; }
  drawRays(pr(ti, T_SPIN, SPIN_D + .4), [52, 100, 188], .5);
  drawPrompt();
  drawLogo1(a);
}

/* the spark spins at centre, then travels into the prompt's top-left corner and back */
function drawLogo1(la) {
  const spin = TWO_PI * 2 * EIO(pr(ti, T_SPIN, SPIN_D));
  const e = ti < T_OUT ? EIO(pr(ti, T_BOX + .4, 1.0)) : 1 - EIO(pr(ti, T_OUT, .9));
  const ey = 20 * (1 - EOUT(pr(ti, T_BOX, .9)));
  const tgt = [CX - boxW() * BS / 2 + 36 * BS, BY + ey + 36 * BS];
  const dst = lerpColor(color(NAVY), color(CREAM), sentAmt());
  const col = lerpColor(color(NAVY), dst, EASE(pr(e, 0, .3)));
  spark(lerp(CX, tgt[0], e), lerp(CY, tgt[1], e), lerp(2.6, .6 * BS, e), spin + TWO_PI * e, col.toString(), la);
}

function drawWindow(iris, rv) {
  push();
  const c = drawingContext;
  c.save();
  c.beginPath(); c.arc(CX, CY, iris, 0, TWO_PI); c.clip();    // iris from the logo
  translate(WIN.x, WIN.y); scale(WIN.s);
  c.save(); c.shadowColor = "rgba(2,3,30,.45)"; c.shadowBlur = 44 * PS; c.shadowOffsetY = 14 * PS;
  noStroke(); fill(255); rect(0, 0, 900, 565, 14); c.restore();
  c.save(); c.beginPath(); c.roundRect(0, 0, 900, 565, 14); c.clip();
  drawSecUI(rv);
  c.restore();
  noFill(); stroke("#dedbd0"); strokeWeight(1.5); rect(.75, .75, 898.5, 563.5, 13.5);
  c.restore();
  pop();
}

/* ============== SCENE 2 (navy): headline + UI filled by the logo ============== */
function drawScene2() {
  noStroke(); fill(DEEP); rect(0, 0, SW_, SH_);
  drawingContext.drawImage(grain, 0, 0);
  drawRays(pr(ti, T_B + .3, 1.7), [52, 100, 188], .9);

  push();
  ht("Stop building", HX, BASE[0], 400, "#fff", 1);
  ht("demos", HX, BASE[1], 400, "#fff", 1);
  const x1 = HX + hw("demos ", 400), x2 = x1 + hw("and ", 400), x3 = HX + hw("prompting ", 600);
  const words = [["and", 400, x1, BASE[1]], ["start", 600, x2, BASE[1]], ["prompting", 600, HX, BASE[2]], ["them.", 600, x3, BASE[2]]];
  for (let i = 0; i < 4; i++) {
    const w = words[i], p = pr(ti, T_WORDS + i * .3, .8);
    if (ti >= T_BACK) { ht(w[0], w[2], w[3], w[1], "#fff", 1); continue; }
    ht(w[0], w[2], w[3] + 30 * (1 - EOUT(p)), w[1], "#fff", EASE(p));
  }
  pop();

  // spin -> iris opens the UI; the logo then sweeps over 3 sections and the data reacts to it
  const TSC = .9, ug = (ux, uy) => [WIN.x + ux * WIN.s, WIN.y + uy * WIN.s];
  const lineY = x => { const q = constrain((x - 207) / 645 * 13, 0, 13), i = min(floor(q), 12); return 362 - lerp(VOL[i], VOL[i + 1], q - i) * 98; };
  const A0 = [180, 145], A1 = [790, 145], B0 = [207, lineY(207)], B1 = [852, lineY(852)], C0 = [310, 436], C1 = [430, 522];
  const uA = pr(ti, tA0, tA1 - tA0), uB = pr(ti, tB0, tB1 - tB0), uC = pr(ti, tC0, tC1 - tC0);
  const hop = (t0, d) => EIO(pr(ti, t0, d));
  let iris = 0, rot = 0, pos = [CX, CY], sc = 2.6;
  const rv = new Array(7).fill(0);
  if (ti >= T_A) {                                     // back to centre, spin back as the iris closes
    const m = EIO(pr(ti, T_A, .6)), pc = EIO(pr(ti, T_A + .5, CLOSE_D - .5)), L = ug(C1[0], C1[1]);
    pos = [lerp(L[0], CX, m), lerp(L[1], CY, m)]; sc = lerp(TSC, 2.6, m);
    iris = WIN_R * (1 - pc); rot = -TWO_PI * 2 * pc; rv.fill(1);
  } else if (ti >= T_S2) {
    const p = pr(ti, T_S2, SPIN_D);
    iris = WIN_R * EIO(p); rot = TWO_PI * 2 * EIO(p);
    let uiPos = null;                                  // logo position in UI coordinates once it is on the screen
    const h0 = hop(T_TOUR - .5, .5), h1 = hop(tA1, .5), h2 = hop(tB1, .5);
    if (ti < tA0) { const g = ug(A0[0], A0[1]); pos = [lerp(CX, g[0], h0), lerp(CY, g[1], h0)]; sc = lerp(2.6, TSC, h0); }
    else {
      sc = TSC;
      if (ti < tA1) uiPos = [lerp(A0[0], A1[0], uA), A0[1]];
      else if (ti < tB0) uiPos = [lerp(A1[0], B0[0], h1), lerp(A1[1], B0[1], h1)];
      else if (ti < tB1) { const x = lerp(B0[0], B1[0], uB); uiPos = [x, lineY(x)]; }
      else if (ti < tC0) uiPos = [lerp(B1[0], C0[0], h2), lerp(B1[1], C0[1], h2)];
      else uiPos = [lerp(C0[0], C1[0], uC), lerp(C0[1], C1[1], uC)];
      pos = ug(uiPos[0], uiPos[1]);
    }
    rot += TWO_PI * (h0 + h1 + h2);
    // data reacts to the logo: tiles fill as it passes, the line is drawn up to it, rows fill as it descends
    const lx = ti < tA0 ? -999 : ti >= tA1 ? 9999 : lerp(A0[0], A1[0], uA);
    [188, 420, 654].forEach((x, i) => { rv[i] = EASE(constrain((lx - (x + 40)) / 90, 0, 1)); });
    rv[3] = ti < tB0 ? 0 : uB;
    const ly = ti < tC0 ? -999 : lerp(C0[1], C1[1], uC);
    [453, 487, 521].forEach((y, i) => { rv[4 + i] = EASE(constrain((ly - (y - 30)) / 34, 0, 1)); });
  }
  if (iris > 0.5) drawWindow(iris, rv);
  const col = lerpColor(color("#fcfcf9"), color(NAVY), constrain(iris / 110, 0, 1));   // cream on navy, navy on the white UI
  spark(pos[0], pos[1], sc, rot, col.toString(), 1);
}

function drawRays(p, rgb, al) {
  if (p <= 0) return;
  const k = EOUT(p);
  push(); translate(CX, CY);
  drawingContext.lineCap = "butt"; strokeWeight(1.35);
  const now = millis() / 1000;
  for (let i = 0; i < NRAYS; i++) {
    for (let b = 0; b < BANDS.length; b++) {
      const a = i * TWO_PI / NRAYS + (b % 2 ? -1 : 1) * .022 * now;   // neighbouring bands drift opposite ways
      const r0 = BANDS[b][0], r1 = BANDS[b][1];
      const f = constrain(k * 1.5 - b * .22, 0, 1);
      if (f <= 0) continue;
      stroke(rgb[0], rgb[1], rgb[2], 255 * al * f);
      const e = lerp(r0, r1, EOUT(f));
      line(cos(a) * r0, sin(a) * r0, cos(a) * e, sin(a) * e);
    }
  }
  pop();
}

/* ---- prompt box (style from the supplied code), centred in the rays ---- */
const BS = 1.15, BY = CY - 84.25 * BS;       // box centred on the rays
function typedCount() {
  const u = ti - TYPE0; if (u < 0) return 0; let n = 0;
  for (let k = 1; k <= TOT; k++) if (RT[k] <= u) n = k; return n;
}
function lastRender() { return ti < TYPE0 ? T_BOX : TYPE0 + RT[max(1, typedCount())]; }
function overlayAlpha() {
  if (ti < T_BOX) return 0;
  const a = EASE(pr(ti, T_BOX, .8));
  return ti >= T_OUT ? a * (1 - EASE(pr(ti, T_OUT, .8))) : a;
}
function sentAmt() { return ti < T_S ? 0 : EASE(pr(ti, T_S, .35)); }
function boxW() { return round(28 + max(tw(L1, 23), tw(L2, 23)) + 6 + 36 + 110); }   // +110: a longer box

function drawPrompt() {
  const ea = overlayAlpha(); if (ea <= 0.002) return;
  const ey = 20 * (1 - EOUT(pr(ti, T_BOX, .9)));
  const cs = sentAmt(), w = boxW();

  push(); drawingContext.globalAlpha = ea;
  translate(CX - w * BS / 2, BY + ey); scale(BS);
  drawingContext.shadowColor = "rgba(15,15,66,.14)"; drawingContext.shadowBlur = 30 * PS; drawingContext.shadowOffsetY = 10 * PS;
  fill(lerpColor(color(255), color(15, 15, 66, 235), cs));
  stroke(150, 144, 128, 204); strokeWeight(1.5);
  rect(.75, .75, w - 1.5, 168.5, 9.25, 9.25, 0, 9.25);
  drawingContext.shadowColor = "transparent";
  const n = typedCount();
  const a = L1.slice(0, min(n, N1)), b = n > N1 ? L2.slice(0, n - N1 - 1) : "";
  const col = lerpColor(color(NAVY), color(CREAM), cs);
  const x0 = 29.5, c1 = 97, c2 = 128;
  tx(a, x0, c1, 23, col, SANS, -.23); tx(b, x0, c2, 23, col, SANS, -.23);
  if (ti < T_S && ti >= TYPE0 - .3 && ((ti - lastRender()) % 1) < .5) {
    const onFirst = n <= N1, lw = tw(onFirst ? a : b, 23, SANS, -.23);
    noStroke(); fill(HL); rect(x0 + lw + 2, (onFirst ? c1 : c2) - 15.6, 2, 30);
  }
  pop();
}

/* ---- Security overview UI. rv[0..4] = tile 1, tile 2, tile 3, chart, table (0 = empty skeleton, 1 = filled) ---- */
const GRAY = "#8a8c99", KPI = [["ASSETS MONITORED", "8,920"], ["OPEN ALERTS", "27"], ["POLICY COVERAGE", "82%"]];
const VOL = [.12, .13, .12, .15, .15, .17, .2, .26, .34, .45, .58, .72, .86, .98];
const ROWS = [["HIGH", "Public storage bucket in card-\u2026", "pay-store-01", "Open"], ["HIGH", "Excess IAM privileges on treas\u2026", "treasury-prod", "Open"], ["MED", "Cardholder data outside appro\u2026", "eu-payments-02", "Open"]];
function ut(str, x, y, size, wt, col, sp, al, a) {
  const c = drawingContext; c.save(); if (a !== undefined) c.globalAlpha *= a;
  c.font = wt + " " + size + "px " + HEAD; c.letterSpacing = (sp || 0) + "px"; c.textAlign = al || "left"; c.textBaseline = "middle";
  c.fillStyle = col; c.fillText(str, x, y); c.restore();
}
function dbox(x, y, w, h, a) {
  if (a <= 0.01) return; const c = drawingContext; c.save(); c.setLineDash([5, 4]);
  c.strokeStyle = "rgba(47,95,160," + (.75 * a) + ")"; c.lineWidth = 1.3; c.beginPath(); c.roundRect(x, y, w, h, 10); c.stroke(); c.restore();
}
function drawSecUI(rv) {
  const c = drawingContext;
  noStroke(); fill(255); rect(0, 0, 900, 565);
  fill("#f7f6f1"); rect(0, 0, 157, 565); fill("#e7e4dc"); rect(157, 0, 1, 565);
  noFill(); stroke("#c9c6bc"); strokeWeight(1.5); rect(27, 25, 28, 28, 7);
  noStroke(); fill("#8b90a8"); rect(37, 35, 8, 8, 1.5);
  fill(255); stroke("#dfdcd2"); strokeWeight(1.2); rect(17, 70, 125, 38, 8); noStroke();
  ut("Overview", 30, 89.5, 15.5, 400, NAVY, -.1);
  [["Alerts", 129], ["Assets", 169], ["Policies", 208]].forEach(n => ut(n[0], 30, n[1], 15.5, 400, GRAY, -.1));
  ut("Security overview", 186, 35, 22, 500, NAVY, -.3);
  ut("Last 30 days", 800, 35, 15, 400, GRAY, 0, "right");
  fill("#e7e4dc"); rect(158, 68, 742, 1);

  // KPI tiles
  dbox(179, 86, 701, 111, rv[0]);
  [188, 420, 654].forEach((x, i) => {
    fill(255); stroke("#e4e1d8"); strokeWeight(1.2); rect(x, 95, 217, 95, 8); noStroke();
    ut(KPI[i][0], x + 20, 118, 13, 400, GRAY, 1.2);
    fill(ca("#eeece5", 1 - rv[i])); rect(x + 20, 138, 90, 36, 7);
    ut(KPI[i][1], x + 20, 156 + 8 * (1 - rv[i]), 36, 500, NAVY, -.6, "left", rv[i]);
  });

  // chart
  dbox(181, 203, 698, 179, rv[3]);
  fill(255); stroke("#e4e1d8"); strokeWeight(1.2); rect(189, 211, 682, 163, 8); noStroke();
  ut("ALERT VOLUME", 207, 232, 13, 400, GRAY, 1.2);
  fill("#ecebe5"); rect(207, 254, 645, 1); rect(207, 308, 645, 1);
  fill("#dedbd2"); rect(207, 362, 645, 1);
  const px = i => 207 + i * 645 / 13, py = i => 362 - VOL[i] * 98;
  const n = rv[3] * 13, k = floor(n);
  if (n > 0) {
    c.save(); c.beginPath(); c.moveTo(px(0), 362); c.lineTo(px(0), py(0));
    for (let i = 1; i <= k && i <= 13; i++) c.lineTo(px(i), py(i));
    let ex = px(k), ey = py(k);
    if (k < 13) { const f = n - k; ex = lerp(px(k), px(k + 1), f); ey = lerp(py(k), py(k + 1), f); c.lineTo(ex, ey); }
    c.lineTo(ex, 362); c.closePath(); c.fillStyle = "rgba(42,98,173,.09)"; c.fill();
    c.beginPath(); c.moveTo(px(0), py(0));
    for (let i = 1; i <= k && i <= 13; i++) c.lineTo(px(i), py(i));
    if (k < 13) c.lineTo(ex, ey);
    c.strokeStyle = "#2a62ad"; c.lineWidth = 2.2; c.lineJoin = "round"; c.stroke();
    for (let i = 0; i <= min(k, 13); i++) {                  // data points appear, then settle
      const fade = i === 13 ? 1 : 1 - EASE(pr(rv[3], .85, .15));
      if (fade <= 0.01) continue;
      c.beginPath(); c.arc(px(i), py(i), i === 13 ? 5.5 : 3, 0, TWO_PI); c.fillStyle = "#fff"; c.fill();
      c.strokeStyle = "#2a62ad"; c.lineWidth = 2; c.globalAlpha = fade; c.stroke(); c.globalAlpha = 1;
    }
    c.restore();
  }

  // findings table
  dbox(181, 393, 698, 150, rv[4]);
  fill(255); stroke("#e4e1d8"); strokeWeight(1.2); rect(189, 401, 682, 134, 8); noStroke();
  [["SEVERITY", 207], ["ALERT", 315], ["ASSET", 590], ["STATUS", 757]].forEach(h => ut(h[0], h[1], 416, 12.5, 400, GRAY, 1.1));
  fill("#ecebe5"); rect(207, 433, 645, 1); rect(207, 470, 645, 1); rect(207, 504, 645, 1);
  [453, 487, 521].forEach((y, r) => {
    const rr = rv[4 + r], d = ROWS[r];
    fill(ca("#eeece5", 1 - rr));
    rect(207, y - 4.5, 34, 9, 4.5); rect(315, y - 4.5, 190, 9, 4.5); rect(590, y - 4.5, 90, 9, 4.5); rect(757, y - 4.5, 40, 9, 4.5);
    ut(d[0], 207, y, 12, 600, r < 2 ? NAVY : "#5a5f78", 1, "left", rr);
    ut(d[1], 315, y, 15.5, 400, NAVY, -.1, "left", rr);
    ut(d[2], 590, y, 14.5, 400, GRAY, -.1, "left", rr);
    ut(d[3], 757, y, 14.5, 400, GRAY, -.1, "left", rr);
  });
}

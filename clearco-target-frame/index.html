<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clearco Target Frame</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400&display=swap">
<style>
:root{--bg:#111;--fg:#fff}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:#000;color:var(--fg);overflow:hidden;
  font:600 14px/1 "Helvetica Neue",Helvetica,Arial,sans-serif}
body{display:flex;flex-direction:column}
nav.site{flex:none;display:flex;justify-content:space-between;align-items:center;gap:12px;height:52px;
  background:#000;color:#fff;
  padding:0 max(16px,env(safe-area-inset-right)) 0 max(16px,env(safe-area-inset-left))}
nav.site a{color:#fff;text-decoration:none}
nav.site a:hover{text-decoration:underline;text-underline-offset:4px}
main{flex:1;min-height:0;position:relative}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
</style>
</head>
<body>
<nav class="site"><a href="../">Apps</a><a href="../">&larr; Back to all projects</a></nav>
<main><canvas id="c" aria-label="Clearco replatforming motif: a target frame with crosshairs slides to wrap each headline, then the dots form the Clearco logo"></canvas></main>
<script>
/* Clearco replatforming motif.
   A target frame (guide lines + corner crosshairs) wraps each scene. Between scenes it resizes ONE axis at a
   time (width, then height, or the reverse), sliding on an ease-in-out curve.
   Scenes: "Stop losing revenue." -> two-line sub-headline -> the i / full-stop dots slide out into the 93-dot logo. */
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

const TL = {
  s1In: [2.0, 2.9], s1Fade: [5.2, 6.0],
  s2In1: [6.5, 7.3], s2In2: [6.7, 7.5],
  dotsIn: [10.8, 11.2], textDim: [10.8, 11.4], textOut: [11.4, 12.2],
  dotY: [10.9, 11.7], dotX: [11.7, 12.5], dotStagger: 0.12,   // dots slide vertically, then horizontally, like the frame
  fadeOut: [17.1, 17.9],
  loop: 18.6,
  // frame moves: each axis slides in its own window
  moves: [
    { to: 1, h: [5.3, 6.1],   v: [6.1, 6.9]   },   // headline -> sub-headline: width, then height
    { to: 2, v: [10.6, 11.4],   h: [11.4, 12.3]  },   // sub-headline -> logo: height, then width
    { to: 0, h: [17.1, 17.8], v: [17.8, 18.5] }    // logo -> headline: width, then height
  ]
};
const clamp01 = v => Math.min(1, Math.max(0, v));
const prog = (T, r) => clamp01((T - r[0]) / (r[1] - r[0]));
const easeOutCubic = p => 1 - Math.pow(1 - p, 3);
const easeInOutCubic = p => p < .5 ? 4*p*p*p : 1 - Math.pow(-2*p + 2, 3) / 2;
const slide = p => reduce ? (p >= 1 ? 1 : 0) : easeInOutCubic(p);
const mixv = (a, b, t) => a + (b - a) * t;

const FONT = '"Instrument Sans", "Helvetica Neue", Arial, sans-serif';
const S1 = 'Stop losing revenue.';
const S2 = ['Plan your e-commerce migration', 'before your next peak season.'];

let W = 0, H = 0, DPR = 1, arm = 20, pad = 30;
let L1 = null, L2 = null, rects = [], sources = [], logoR = 4;
let t0 = 0, ready = false;

function setFont(c, size) {
  c.font = '400 ' + size + 'px ' + FONT;
  if ('letterSpacing' in c) c.letterSpacing = (-size * .03) + 'px';
}

/* ---------- layout ---------- */
function layout() {
  DPR = Math.min(2, devicePixelRatio || 1);
  W = cv.clientWidth; H = cv.clientHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  arm = Math.max(14, Math.min(40, Math.min(W, H) * .055));
  pad = arm * 1.5;
  const maxText = W - 2 * (pad + arm + 8);
  const m = document.createElement('canvas').getContext('2d');

  // Scene 1: one centred line
  let s1 = Math.min(80, Math.max(20, W * .036));
  setFont(m, s1);
  let w1 = m.measureText(S1).width;
  if (w1 > maxText) { s1 *= maxText / w1; setFont(m, s1); w1 = m.measureText(S1).width; }
  L1 = { size: s1, w: w1, y: H / 2 + s1 * .33 };

  // Scene 2: two lines, block centred, lines left aligned
  let s2 = Math.min(80, Math.max(20, W * .036));
  setFont(m, s2);
  let maxW = Math.max(...S2.map(t => m.measureText(t).width));
  if (maxW > maxText) { s2 *= maxText / maxW; setFont(m, s2); maxW = Math.max(...S2.map(t => m.measureText(t).width)); }
  const lh = s2 * 1.22;
  L2 = { size: s2, lh, w: maxW, x: (W - maxW) / 2, y1: H / 2 - lh / 2 + s2 * .3 };

  buildDots();

  // Frame rectangle for each scene
  const box = (l, t, r, b) => ({ l: l - pad, t: t - pad, r: r + pad, b: b + pad });
  rects = [
    box(W / 2 - L1.w / 2, L1.y - s1 * .8, W / 2 + L1.w / 2, L1.y + s1 * .28),
    box(L2.x, L2.y1 - s2 * .8, L2.x + L2.w, L2.y1 + lh + s2 * .28),
    (() => {
      let l = 1e9, t = 1e9, r = -1e9, b = -1e9;
      for (const p of sources) { l = Math.min(l, p.tx); r = Math.max(r, p.tx); t = Math.min(t, p.ty); b = Math.max(b, p.ty); }
      return box(l - logoR, t - logoR, r + logoR, b + logoR);
    })()
  ];
}

/* ---------- dots: the i / full-stop dots are the seeds that burst into the logo ---------- */
const LOGO_DOTS = [[-481.7,-13.1],[-481.7,14.1],[-468.7,-34.5],[-468.7,36.5],[-445.2,-47.1],[-445.2,47.6],[-419.1,-50.5],[-419.1,51.0],[-395.3,-45.6],[-395.3,46.7],[-374.7,-32.9],[-374.7,34.3],[-334.8,-47.6],[-334.8,-23.8],[-334.8,-0.4],[-334.8,23.7],[-334.8,46.7],[-310.3,47.6],[-286.6,47.6],[-263.5,47.6],[-239.7,47.6],[-206.0,-47.6],[-206.0,-23.8],[-206.0,-0.4],[-206.0,23.7],[-206.0,47.6],[-181.3,-47.6],[-181.3,-0.4],[-181.3,47.6],[-158.0,-47.6],[-158.0,-0.4],[-158.0,47.6],[-134.5,-47.6],[-134.5,-0.4],[-134.5,47.6],[-111.2,-47.6],[-111.2,47.6],[-76.2,49.9],[-63.7,28.1],[-52.1,7.7],[-40.1,-13.1],[-40.1,28.1],[-28.5,-32.9],[-17.0,-50.5],[-17.0,28.1],[-6.2,-32.9],[5.2,-13.1],[6.8,28.1],[16.9,7.7],[28.7,28.1],[40.6,47.6],[76.9,-47.1],[76.9,-23.8],[76.9,0.4],[76.9,23.7],[76.9,47.6],[101.3,-47.6],[101.3,-0.4],[124.8,-47.6],[124.8,-0.4],[148.2,-47.6],[148.2,-0.4],[163.6,23.7],[171.0,-45.6],[172.6,-2.5],[181.5,-23.8],[181.5,47.6],[218.0,-13.1],[218.0,14.1],[231.4,-34.5],[231.4,35.4],[254.8,-47.1],[254.8,47.6],[280.8,-50.5],[280.8,51.0],[304.4,-45.6],[304.4,46.7],[325.4,-32.9],[325.4,35.4],[362.0,-11.6],[362.0,14.1],[375.2,-32.9],[375.2,35.4],[398.8,-45.6],[398.8,46.7],[424.6,-47.6],[424.6,49.9],[448.3,-44.0],[448.3,46.7],[469.0,-31.9],[469.0,34.3],[481.8,-11.6],[481.8,14.1]];
const LOGO_SPAN = 963.5, LOGO_DOT_R = 7.63;

function buildDots() {
  const off = document.createElement('canvas');
  off.width = W; off.height = H;
  const o = off.getContext('2d', { willReadFrequently: true });
  o.fillStyle = '#fff'; o.textBaseline = 'alphabetic';
  setFont(o, L2.size);
  S2.forEach((t, i) => o.fillText(t, L2.x, L2.y1 + i * L2.lh));
  const data = o.getImageData(0, 0, W, H).data;
  const on = (x, y) => x >= 0 && y >= 0 && x < W && y < H && data[(y * W + x) * 4 + 3] > 128;

  const seeds = [];
  const bandTop = Math.max(0, Math.floor(L2.y1 - L2.size * 1.1));
  const bandBot = Math.min(H - 1, Math.ceil(L2.y1 + L2.lh + L2.size * .4));
  const seen = new Uint8Array(W * H);
  for (let y = bandTop; y <= bandBot; y++) for (let x = 0; x < W; x++) {
    if (seen[y * W + x] || !on(x, y)) continue;
    const stack = [x, y]; seen[y * W + x] = 1;
    let n = 0, sx = 0, sy = 0, x0 = x, x1 = x, y0 = y, y1 = y;
    while (stack.length) {
      const py = stack.pop(), px = stack.pop();
      n++; sx += px; sy += py;
      if (px < x0) x0 = px; if (px > x1) x1 = px; if (py < y0) y0 = py; if (py > y1) y1 = py;
      for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
        const nx = px + dx, ny = py + dy;
        if (nx < 0 || ny < bandTop || nx >= W || ny > bandBot || seen[ny * W + nx] || !on(nx, ny)) continue;
        seen[ny * W + nx] = 1; stack.push(nx, ny);
      }
    }
    const bw = x1 - x0 + 1, bh = y1 - y0 + 1, aspect = bw / bh;
    if (n < L2.size * L2.size * .03 && bh < L2.size * .2 && aspect > .65 && aspect < 1.5)
      seeds.push({ x: sx / n, y: sy / n, r: Math.sqrt(n / Math.PI) });
  }
  if (!seeds.length) seeds.push({ x: W / 2, y: H / 2, r: Math.max(2, L2.size * .05) });
  seeds.sort((a, b) => a.x - b.x);

  const span = Math.min(W * (W < 560 ? .6 : .48), 1100), k = span / LOGO_SPAN;
  logoR = Math.max(2, LOGO_DOT_R * k);
  const targets = LOGO_DOTS.map(([x, y]) => ({ x: W / 2 + x * k, y: H / 2 + y * k })).sort((a, b) => a.x - b.x);
  // Each dot leaves a seed and slides straight to its slot: one axis, then the other. A hair of left-to-right stagger.
  sources = targets.map((t, i) => {
    const sd = seeds[Math.min(seeds.length - 1, Math.floor(i * seeds.length / targets.length))];
    return { sx: sd.x, sy: sd.y, sr: sd.r, tx: t.x, ty: t.y, delay: i / targets.length * TL.dotStagger };
  });
}

/* ---------- frame: one axis at a time ---------- */
function frameAt(T) {
  let cur = rects[0];
  for (const mv of TL.moves) {
    if (T < Math.min(mv.h[0], mv.v[0])) break;
    const a = cur, b = rects[mv.to], eh = slide(prog(T, mv.h)), ev = slide(prog(T, mv.v));
    cur = { l: mixv(a.l, b.l, eh), r: mixv(a.r, b.r, eh), t: mixv(a.t, b.t, ev), b: mixv(a.b, b.b, ev) };
  }
  return cur;
}

/* ---------- drawing ---------- */
/* Whip zoom: u runs 1 -> 0 on the way in (from the right) and 0 -> -1 on the way out (to the left),
   driven by the same easeInOutCubic as the frame's line slides. The zoom and a touch of blur peak at the
   fastest point of the ease (its velocity), so the text snaps in like the frame edges do. */
const HAS_FILTER = 'filter' in CanvasRenderingContext2D.prototype;
const easeVel = p => Math.min(1, (easeInOutCubic(clamp01(p + .02)) - easeInOutCubic(clamp01(p - .02))) / .04 / 3);
function drawWhip(lines, cx, cy, u, vel, alpha) {
  if (alpha <= .002) return;
  ctx.save();
  ctx.globalAlpha = alpha;
  if (!reduce) {
    ctx.translate(cx + u * 56, cy);
    const sc = 1 + .07 * Math.abs(u);                 // subtle zoom
    ctx.scale(sc, sc);
    ctx.translate(-cx, -cy);
    if (HAS_FILTER && vel > .02) ctx.filter = 'blur(' + (vel * 5).toFixed(2) + 'px)';
  }
  ctx.fillStyle = '#fff'; ctx.textBaseline = 'alphabetic';
  for (const l of lines) { setFont(ctx, l.size); ctx.textAlign = l.align; ctx.fillText(l.text, l.x, l.y); }
  ctx.restore();
}

function draw(T) {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = '#111'; ctx.fillRect(0, 0, W, H);
  const fr = frameAt(T);

  // guide lines run the full width / height
  ctx.strokeStyle = '#2b2b2b'; ctx.lineWidth = Math.max(2, Math.min(W, H) * .0035);
  ctx.beginPath();
  for (const x of [fr.l, fr.r]) { ctx.moveTo(x, 0); ctx.lineTo(x, H); }
  for (const y of [fr.t, fr.b]) { ctx.moveTo(0, y); ctx.lineTo(W, y); }
  ctx.stroke();

  // Scene 1: whips in with the width slide, whips out as the frame moves on
  if (T < TL.s1Fade[1]) {
    const pi = prog(T, TL.s1In), po = prog(T, TL.s1Fade);
    const u = (1 - easeInOutCubic(pi)) - easeInOutCubic(po);
    const vel = po > 0 ? easeVel(po) : easeVel(pi);
    drawWhip([{ text: S1, x: W / 2, y: L1.y, size: L1.size, align: 'center' }], W / 2, H / 2, u, vel, 1 - Math.abs(u));
  }
  // Scene 2: both lines whip in (staggered), then dim and whip out as the dots take over
  if (T >= TL.s2In1[0] && T < TL.textOut[1]) {
    const dim = T >= TL.textDim[0] ? mixv(1, .28, easeInOutCubic(prog(T, TL.textDim))) : 1;
    const po = prog(T, TL.textOut), cy = L2.y1 + L2.lh / 2 - L2.size * .25, cx = L2.x + L2.w / 2;
    for (let i = 0; i < 2; i++) {
      const pi = prog(T, i ? TL.s2In2 : TL.s2In1);
      const u = (1 - easeInOutCubic(pi)) - easeInOutCubic(po);
      const vel = po > 0 ? easeVel(po) : easeVel(pi);
      drawWhip([{ text: S2[i], x: L2.x, y: L2.y1 + i * L2.lh, size: L2.size, align: 'left' }], cx, cy, u, vel, dim * (1 - Math.abs(u)));
    }
  }
  // Scene 3: the dots of the i's and the full stop slide out to the logo, one axis at a time (same ease as the frame)
  if (T >= TL.dotsIn[0]) {
    const fade = 1 - easeInOutCubic(prog(T, TL.fadeOut));
    const ap = easeOutCubic(prog(T, [TL.dotsIn[0], TL.dotsIn[0] + .4]));
    const ey = d => slide(prog(T - d.delay, TL.dotY)), ex = d => slide(prog(T - d.delay, TL.dotX));
    ctx.fillStyle = '#fff';
    for (const d of sources) {
      const py = ey(d), px = ex(d);
      const x = mixv(d.sx, d.tx, px), y = mixv(d.sy, d.ty, py);
      const r = mixv(d.sr, logoR, (py + px) / 2);
      const a = ap * fade;
      if (a <= .01 || r <= .05) continue;
      ctx.globalAlpha = a; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  // crosshairs on the four corners, on top
  ctx.strokeStyle = '#fff'; ctx.lineWidth = Math.max(2, Math.min(W, H) * .0045);
  ctx.beginPath();
  for (const x of [fr.l, fr.r]) for (const y of [fr.t, fr.b]) {
    ctx.moveTo(x - arm, y); ctx.lineTo(x + arm, y);
    ctx.moveTo(x, y - arm); ctx.lineTo(x, y + arm);
  }
  ctx.stroke();
}

function frame(now) {
  if (ready) draw(((now - t0) / 1000) % TL.loop);
  requestAnimationFrame(frame);
}

/* ---------- boot: wait for the font, then lay out and start the clock ---------- */
const startAt = parseFloat(new URLSearchParams(location.search).get('t')) || 0;   // ?t=13 jumps into the sequence
function boot() { layout(); t0 = performance.now() - startAt * 1000; ready = true; }
Promise.all([document.fonts.load('400 40px "Instrument Sans"')]).then(boot, boot);
new ResizeObserver(() => { if (ready) layout(); }).observe(cv);
requestAnimationFrame(frame);
</script>
</body>
</html>
